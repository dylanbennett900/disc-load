<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DBSP Hub</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DBSP Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f2235">
<link rel="apple-touch-icon" href="roster-icon.png">
<link rel="icon" href="roster-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* DBSP current visual system (matches dbsportperformance.com guide/onboarding pages).
   Deep navy hero, cyan highlight + CTA, green for data/done, JetBrains Mono labels, off-white content area.
   Do NOT revert to the old editorial navy-only theme. See DESIGN.md. */
:root{--bg:#f4f2ee;--bg2:#eceae5;--sf:#fff;--sf2:#f9f8f5;--bd:rgba(15,34,53,.09);--bd2:rgba(15,34,53,.18);--navy:#1a3a5c;--navy-deep:#0f2235;--mid:#2d62a0;--cyan:#00d4ff;--cyan-dk:#0094b3;--green-br:#00e87a;--t:#1a1a18;--t2:#4a4a46;--t3:#6f6f69;--t4:#9a9a93;--red:#d63a2f;--amber:#c98a00;--green:#00a85a;--display:'Barlow Condensed',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
body{background:var(--bg);color:var(--t);font:14px/1.45 'DM Sans',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy-deep);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
h1{font:900 24px/1 var(--display);letter-spacing:1px;text-transform:uppercase}
h1 em{font-style:italic;color:var(--cyan)}
.hsub{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-top:4px}
header .sp{flex:1}
.btn{font:800 12px var(--display);letter-spacing:.7px;text-transform:uppercase;border-radius:6px;padding:8px 14px;border:1.5px solid var(--bd2);background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap}
.btn.p{background:var(--cyan);border-color:var(--cyan);color:var(--navy-deep)}
header .btn{background:var(--cyan);color:var(--navy-deep);border-color:var(--cyan)}
.btn.sm{padding:5px 10px;font-size:11px}
.btn.danger{color:var(--red);border-color:rgba(192,57,43,.35)}
main{max-width:980px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--navy-deep);border:1px solid var(--navy-deep);border-radius:10px;padding:12px 14px}
.stat .k{font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.stat .v{font:900 30px/1.1 var(--display);margin-top:3px;color:var(--cyan)}
.stat .v.red{color:#ff6b5e}.stat .v.amber{color:#ffb400}
.sect{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin:20px 0 8px}
.queue{background:#fff;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:6px}
.qrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--bd);cursor:pointer}
.qrow:first-child{border-top:none}
.qrow .n{font-weight:700;flex:1}
.qrow .d{font-size:12px;color:var(--t3)}
.pill{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:12px;white-space:nowrap}
.pill.red{background:rgba(214,58,47,.12);color:var(--red)}.pill.amber{background:rgba(255,180,0,.16);color:#9a6a00}.pill.green{background:rgba(0,232,122,.16);color:#007a42}.pill.grey{background:rgba(15,34,53,.07);color:var(--t3)}
.tabs{display:flex;background:var(--navy-deep);border-top:1px solid rgba(255,255,255,.08);padding:0 16px;gap:4px;position:sticky;top:var(--hdrh,64px);z-index:19}
.tab{font:800 13px var(--display);letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.55);background:none;border:none;border-bottom:3px solid transparent;padding:8px 14px 9px;cursor:pointer}
.tab.on{color:#fff;border-bottom-color:var(--cyan)}
.fg .f[data-only]{display:none}
form[data-kind=client] .fg .f[data-only=client],form[data-kind=team] .fg .f[data-only=team]{display:flex}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:18px 0 10px}
.chip{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:6px;border:1.5px solid var(--bd2);background:#fff;color:var(--t3);cursor:pointer}
.chip.on{background:var(--navy-deep);border-color:var(--navy-deep);color:var(--cyan)}
.card{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--bd2);border-radius:10px;padding:14px;margin-bottom:10px;scroll-margin-top:80px}
.card.red{border-left-color:var(--red)}.card.amber{border-left-color:var(--amber)}.card.green{border-left-color:var(--green)}
.card.off{opacity:.6}
.ctop{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.cname{font:900 22px/1.1 var(--display);letter-spacing:.3px;text-transform:uppercase;color:var(--navy-deep)}
.cmeta{font-size:12px;color:var(--t3);margin-top:3px}
.tag{display:inline-block;font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:rgba(0,212,255,.12);color:var(--cyan-dk);margin-right:4px}
.ctop .sp{flex:1}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:12px}
.cell{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:9px 11px}
.cell .k{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--t4);margin-bottom:3px}
.cell .v{font-size:13px;font-weight:600;color:var(--t2)}
.big{font:800 18px var(--display);letter-spacing:.3px}
.red{color:var(--red)}.amber{color:var(--amber)}.green{color:var(--green)}.muted{color:var(--t4);font-weight:500}
.log{margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}
.log .k{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--t4);margin-bottom:6px}
.note{font-size:13px;color:var(--t2);padding:4px 0;display:flex;gap:8px}
.note .dt{color:var(--t4);font-size:12px;white-space:nowrap;min-width:52px}
.addnote{display:flex;gap:6px;margin-top:6px}
.addnote input{flex:1;font:13px 'DM Sans',sans-serif;padding:7px 10px;border:1.5px solid var(--bd2);border-radius:6px;background:var(--sf2)}
.goals{font-size:12.5px;color:var(--t2);margin-top:10px}
.link{background:none;border:none;color:var(--mid);font-size:12px;font-weight:600;cursor:pointer;padding:2px 0}
.empty,.gate{text-align:center;color:var(--t3);padding:48px 16px}
.gate h2{font:900 30px var(--display);color:var(--navy-deep);margin-bottom:8px;text-transform:uppercase}
.gate p{margin-bottom:16px}
.scrim{position:fixed;inset:0;background:rgba(20,33,47,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.sheet{border-radius:14px}}
.sheet h3{font:900 24px var(--display);text-transform:uppercase;letter-spacing:.4px;margin-bottom:12px;color:var(--navy-deep)}
.ssec{font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin:14px 0 6px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px}
.f.full{grid-column:1/-1}
.f label{font-size:11px;font-weight:600;color:var(--t3)}
.f input,.f select,.f textarea{font:14px 'DM Sans',sans-serif;padding:8px 10px;border:1.5px solid var(--bd2);border-radius:6px;background:var(--sf2);color:var(--t);width:100%}
.f textarea{min-height:60px;resize:vertical}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sheet-acts{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
.td{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--green);border-radius:10px;padding:11px 13px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.td{border-left-color:var(--cyan)}.td[data-s=later]{border-left-color:var(--amber)}.td[data-s=done]{border-left-color:var(--t4);opacity:.6}.td[data-s=dropped]{border-left-color:var(--red);opacity:.45}
.td[data-s=done] .tt,.td[data-s=dropped] .tt{text-decoration:line-through}
.tick{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--bd2);background:#fff;cursor:pointer;margin-top:1px;font:800 13px/1 var(--display);color:var(--navy-deep)}
.td[data-s=done] .tick{background:var(--green-br);border-color:var(--green-br)}
.td .bd{flex:1;min-width:0;cursor:pointer}
.tt{font-weight:700;color:var(--t)}
.tnum{font:700 11px var(--mono);color:var(--cyan-dk);margin-right:6px;letter-spacing:.02em}
.tdet{font-size:12.5px;color:var(--t3);margin-top:3px}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.tmeta a{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--cyan-dk)}
.quickadd{display:flex;gap:6px;margin:14px 0 4px}
.quickadd input{flex:1;min-width:0;font:14px 'DM Sans',sans-serif;padding:9px 11px;border:1.5px solid var(--bd2);border-radius:6px;background:#fff}
.quickadd select{font:13px 'DM Sans',sans-serif;padding:8px;border:1.5px solid var(--bd2);border-radius:6px;background:#fff;max-width:36%;min-width:0}
.ft{margin-top:12px;background:var(--navy-deep);color:#fff;border-radius:10px;padding:14px;}
.ft-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ft-ratio{flex-shrink:0}
.ft-eb{font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.ft-t{font:900 20px/1.1 var(--display);text-transform:uppercase;margin-top:3px}
.ft-t em{font-style:italic;color:var(--cyan)}
.ft-sub{font:500 10px var(--mono);letter-spacing:.06em;color:rgba(255,255,255,.55);margin-top:4px;text-transform:uppercase}
.ft-ratio{text-align:right}
.ft-ratio .n{font:900 30px/1 var(--display)}
.ft-ratio .l{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:2px}
.ft-flags{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.ft-flag{font-size:12.5px;padding:6px 9px;border-radius:6px;background:rgba(255,255,255,.06);border-left:3px solid var(--cyan)}
.ft-flag.red{border-left-color:#ff6b5e}.ft-flag.amber{border-left-color:#ffb400}.ft-flag.ok{border-left-color:var(--green-br)}
.ft-wknav{display:grid;grid-template-columns:30px 1fr 30px;gap:8px;align-items:center;margin:14px 0 9px}
.ft-wknav button{height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-size:17px;line-height:1;cursor:pointer}
.ft-wknav button:disabled{opacity:.25;cursor:default}
.ft-wknav div{text-align:center}
.ft-wknav b{display:block;font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#fff}
.ft-wknav span{font:500 10px var(--mono);color:rgba(255,255,255,.55)}
.ft-sec{font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin:14px 0 7px;display:flex;justify-content:space-between}
.ft-row{display:grid;grid-template-columns:42px 1fr 112px;gap:8px;align-items:center;margin-bottom:6px;font:500 11px var(--mono)}
.ft-row .k{color:rgba(255,255,255,.7);letter-spacing:.06em}
.ft-row .v{text-align:right;color:rgba(255,255,255,.85)}
.ft-row .v b{color:#fff}
.ft-bar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;position:relative;overflow:hidden}
.ft-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--cyan)}
.ft-bar i.done{background:var(--green-br)}.ft-bar i.over{background:#ffb400}
.ft-bar s{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55)}
.ft-trend{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;height:92px;position:relative}
.ft-trend .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.ft-trend .b{width:100%;max-width:34px;border-radius:4px 4px 0 0;background:rgba(0,212,255,.55)}
.ft-trend .b.cur{background:var(--cyan)}.ft-trend .b.hi{background:#ffb400}
.ft-trend .p{font:500 9.5px var(--mono);color:rgba(255,255,255,.75)}
.ft-trend .line{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.4)}
.ft-wk{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px;font:500 9px var(--mono);color:rgba(255,255,255,.45);text-align:center;text-transform:uppercase}
.ft-sess{font-size:12.5px;display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.08)}
.ft-sess .d{font:500 10.5px var(--mono);color:rgba(255,255,255,.5)}
.ft-sess .m{font:500 10.5px var(--mono);color:rgba(255,255,255,.75);text-align:right;white-space:nowrap}
.ft-more{background:none;border:none;color:var(--cyan);font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;padding:8px 0 0}
.ft-empty{font-size:13px;color:rgba(255,255,255,.6);margin-top:8px}
.tdash{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:none;-webkit-overflow-scrolling:touch}
.tdash.open{display:block}
.td-top{background:var(--navy-deep);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px}
.td-top .sp{flex:1}
.td-main{max-width:1100px;margin:0 auto;padding:16px}
.td-hero{background:var(--navy-deep);color:#fff;border-radius:12px;padding:16px;margin-bottom:12px}
.td-hero .t{font:900 34px/1 var(--display);text-transform:uppercase}
.td-hero .t em{font-style:italic;color:var(--cyan)}
.td-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.td-kpi{background:rgba(255,255,255,.06);border-radius:8px;padding:10px 12px}
.td-kpi .k{font:500 9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.td-kpi .v{font:900 28px/1.1 var(--display);color:var(--cyan);margin-top:2px}
.td-kpi .v small{font-size:15px;color:rgba(255,255,255,.5)}
.td-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.td-grid{grid-template-columns:1.3fr 1fr}}
.td-card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px}
.td-card h4{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.td-card h4 span{color:var(--t3)}
.hb{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;margin-bottom:6px;font-size:12.5px}
.hb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hb .v{font:700 11px var(--mono);text-align:right}
.hb .bar{height:12px;background:var(--bg2);border-radius:6px;position:relative;overflow:hidden}
.hb .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--cyan)}
.hb .bar i.done{background:var(--green-br)}.hb .bar i.over{background:#ffb400}.hb .bar i.none{background:transparent}
.hb .bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--navy-deep)}
.hb .bar u{position:absolute;top:0;bottom:0;width:1px;background:rgba(15,34,53,.25)}
.vt{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;position:relative;margin-top:6px}
.vt .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;position:relative}
.vt .b{width:100%;max-width:46px;background:var(--navy);border-radius:5px 5px 0 0;position:relative}
.vt .b.cur{background:var(--cyan)}
.vt .rg{position:absolute;width:2px;background:rgba(15,34,53,.35);left:50%;transform:translateX(-50%)}
.vt .p{font:700 11px var(--mono);color:var(--navy-deep)}
.vt .line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--cyan-dk)}
.vt-l{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px;font:500 9.5px var(--mono);color:var(--t3);text-align:center;text-transform:uppercase}
.mchips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tbl-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px}
table.sq{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
table.sq th{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--t3);text-align:right;padding:6px 6px;border-bottom:1.5px solid var(--bd2);cursor:pointer;white-space:nowrap}
table.sq th:first-child,table.sq td:first-child{text-align:left}
table.sq td{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
table.sq td.nm{font-weight:700;max-width:150px;overflow:hidden;text-overflow:ellipsis}
table.sq tr.pl{cursor:pointer}
table.sq tr.pl:hover td,table.sq tr.pl.on td{background:rgba(0,212,255,.08)}
table.sq td.fl{text-align:left;white-space:normal;font-size:12px;color:var(--t2);min-width:160px}
.pc{font:700 11.5px var(--mono)}
.pc.lo{color:var(--t3)}.pc.ok{color:var(--green)}.pc.hi{color:#b07800}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--green-br)}
.dot.amber{background:#ffb400}.dot.red{background:#ff6b5e}.dot.grey{background:var(--t4)}
table.sq tr.xp td{padding:0 0 10px;background:transparent}
.ci-strip{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:2px}
.ci-strip span{height:18px;border-radius:3px;background:rgba(255,255,255,.08);position:relative}
.ci-strip span.good{background:var(--green-br)}.ci-strip span.fatigued{background:#38bdf8}.ci-strip span.sore{background:#ffb400}.ci-strip span.both{background:#c084fc}
.ci-strip span i{position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:50%;background:#ff6b5e}
.ci-leg{display:flex;gap:10px;flex-wrap:wrap;font:500 9.5px var(--mono);color:rgba(255,255,255,.55);margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
.ci-leg b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.ci-last{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:8px;line-height:1.5}
.ci-last .nig{color:#ffb400;font-weight:700}
.pos{font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--t3);margin-left:6px}
.jn{font:700 11px var(--mono);color:var(--cyan-dk);margin-right:5px}
.ed-row{display:grid;grid-template-columns:2fr 80px 1.3fr auto;gap:8px;align-items:end;margin-bottom:12px}
.ed-row label{font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--t3);display:block;margin-bottom:3px}
.ed-row input,.ed-row select{width:100%;font:14px 'DM Sans',sans-serif;padding:8px 10px;border:1.5px solid var(--bd2);border-radius:6px;background:var(--sf2)}
@media(max-width:560px){.ed-row{grid-template-columns:80px 1fr}.ed-row .full{grid-column:1/-1}}
.pillars{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(260px,1fr));gap:12px;align-items:start}
@media(max-width:860px){.pillars{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:16px;margin:0 -16px;padding:0 16px 10px;gap:10px;-webkit-overflow-scrolling:touch}
  .pillar{flex:0 0 86%;scroll-snap-align:start}}
.pillar{background:var(--bg2);border-radius:12px;padding:10px;min-width:0}
.pillar-h{background:var(--navy-deep);color:#fff;border-radius:9px;padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pillar-h b{font:900 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.4px}
.pillar-h span{font:500 10px var(--mono);letter-spacing:.1em;color:var(--cyan)}
.pillar .td{margin-bottom:6px}
.pillar .tdet{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pillar .empty{padding:18px 8px;font-size:12.5px}
.padd{display:flex;gap:6px;margin-top:4px}
.padd input{flex:1;min-width:0;font:13px 'DM Sans',sans-serif;padding:8px 10px;border:1.5px dashed var(--bd2);border-radius:8px;background:transparent}
.padd input:focus{border-style:solid;background:#fff;outline:none}
main.wide{max-width:1400px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy-deep);color:var(--cyan);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div><h1>DBSP <em>Hub</em></h1><div class="hsub">Clients · Teams · To-dos</div></div>
  <div class="sp"></div>
  <button class="btn" id="addBtn" style="display:none" onclick="onAdd()">+ Client</button>
  <button class="btn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" onclick="lock()" title="Forget passphrase on this device">Lock</button>
</header>
<nav class="tabs" id="tabs" style="display:none"><button class="tab" data-t="client" onclick="setTab('client')">Clients</button><button class="tab" data-t="team" onclick="setTab('team')">Teams</button><button class="tab" data-t="todo" onclick="setTab('todo')">To-dos</button></nav>
<main id="main"><div class="empty">Loading…</div></main>

<!-- Client editor -->
<div class="scrim" id="scrim" onclick="if(event.target===this)closeEditor()">
  <form class="sheet" id="form" onsubmit="saveClient(event)">
    <h3 id="formTitle">New client</h3>
    <input type="hidden" name="kind" id="kindInp">
    <div class="ssec" id="secLbl">Client</div>
    <div class="fg">
      <div class="f"><label>Name</label><input name="name" required></div>
      <div class="f" data-only="client"><label>Team</label><input name="team" placeholder="e.g. Sunder"></div>
      <div class="f" data-only="team"><label>Division / competition</label><input name="team" disabled placeholder="e.g. AUC Open"></div>
      <div class="f" data-only="client"><label>Offer</label><select name="offer"><option value="coaching">Custom coaching</option><option value="rehab">Injury rehab</option><option value="speed">Speed sessions</option><option value="selfserve">Self-serve</option></select></div>
      <div class="f"><label>Status</label><select name="status"><option value="active">Active</option><option value="paused">Paused</option><option value="ended">Ended</option></select></div>
      <div class="f"><label>Started</label><input type="date" name="start_date"></div>
      <div class="f" data-only="client"><label>Frisbee Track account</label><select name="app_user_id" id="appUserSel"><option value="">Not linked</option></select></div>
      <div class="f" data-only="team"><label>Frisbee Track team code</label><select name="team_code" id="teamCodeSel"><option value="">None</option></select></div>
      <div class="f" data-only="team"><label>Squad size</label><input type="number" name="squad_size" min="1" max="60"></div>
      <div class="f" data-only="team"><label>Main contact</label><input name="contact" placeholder="e.g. Captain or coach"></div>
    </div>
    <div class="ssec">Program</div>
    <div class="fg">
      <div class="f full"><label>Programmed in TeamBuildr until</label><input type="date" name="programmed_until"></div>
      <div class="f"><label>Current block</label><input name="block_name" placeholder="e.g. Pre-season B2"></div>
      <div class="f"><label>Phase</label><input name="phase" placeholder="e.g. Strength-speed"></div>
      <div class="f"><label>Block started</label><input type="date" name="block_start"></div>
      <div class="f"><label>Block length (weeks)</label><input type="number" name="block_weeks" min="1" max="16"></div>
    </div>
    <div class="ssec">Season</div>
    <div class="fg">
      <div class="f"><label>Next tournament</label><input name="next_tournament" placeholder="e.g. Nationals"></div>
      <div class="f"><label>Tournament date</label><input type="date" name="tournament_date"></div>
      <div class="f full"><label>Goals</label><textarea name="goals"></textarea></div>
    </div>
    <div class="sheet-acts">
      <button type="button" class="btn danger" id="delBtn" onclick="deleteClient()">Delete</button>
      <div style="display:flex;gap:8px;margin-left:auto"><button type="button" class="btn" onclick="closeEditor()">Cancel</button><button class="btn p" type="submit">Save</button></div>
    </div>
  </form>
</div>

<!-- Quick "programmed until" update -->
<div class="scrim" id="pScrim" onclick="if(event.target===this)closeProg()">
  <div class="sheet">
    <h3 id="pTitle">Programmed until</h3>
    <div class="f"><label>Last date with a session in TeamBuildr</label><input type="date" id="pDate"></div>
    <div class="quick">
      <button class="btn sm" onclick="bump(7)">+1 wk</button><button class="btn sm" onclick="bump(14)">+2 wk</button>
      <button class="btn sm" onclick="bump(28)">+4 wk</button><button class="btn sm" onclick="bump(42)">+6 wk</button>
    </div>
    <div class="f" style="margin-top:12px"><label>Note (optional)</label><input id="pNote" placeholder="e.g. Wrote pre-season B3"></div>
    <div class="sheet-acts"><span></span><div style="display:flex;gap:8px"><button class="btn" onclick="closeProg()">Cancel</button><button class="btn p" onclick="saveProg()">Save</button></div></div>
  </div>
</div>
<!-- To-do editor -->
<div class="scrim" id="tScrim" onclick="if(event.target===this)closeTodo()">
  <form class="sheet" id="tForm" onsubmit="saveTodo(event)">
    <h3 id="tTitle">New to-do</h3>
    <div class="fg">
      <div class="f full"><label>To-do</label><input name="title" required maxlength="200"></div>
      <div class="f"><label>Section</label><input name="section" list="secList" placeholder="e.g. Coaching + leads"><datalist id="secList"></datalist></div>
      <div class="f"><label>Status</label><select name="status"><option value="open">Open</option><option value="later">Later</option><option value="done">Done</option><option value="dropped">Dropped</option></select></div>
      <div class="f"><label>Due (optional)</label><input type="date" name="due_date"></div>
      <div class="f"><label>Needs checking?</label><select name="needs_check"><option value="false">No</option><option value="true">Yes, may already be done</option></select></div>
      <div class="f full"><label>Details</label><textarea name="detail"></textarea></div>
      <div class="f full"><label>Link (optional)</label><input name="link" type="url" placeholder="e.g. the Claude chat it came from"></div>
    </div>
    <div class="sheet-acts">
      <button type="button" class="btn danger" id="tDel" onclick="deleteTodo()">Delete</button>
      <div style="display:flex;gap:8px;margin-left:auto"><button type="button" class="btn" onclick="closeTodo()">Cancel</button><button class="btn p" type="submit">Save</button></div>
    </div>
  </form>
</div>
<div id="tdash" class="tdash"></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
var COACH_UID='c0b4da2f-8ee8-4926-8b27-0d095cab8e17';
var OFFER_LABEL={coaching:'Custom coaching',rehab:'Injury rehab',speed:'Speed sessions',selfserve:'Self-serve'};
var KEY_STORE='dbsp_roster_key',tab='client',teamMembers={},teamCodes=[],byUser={},rkey=null,clients=[],notes={},appUsers=[],loads={},filter='active',editing=null,progId=null,expanded={},todos=[],tFilter='open',tEditing=null,athletes={},sessBy={},ftOpen={},profiles={},ciBy={},teamSettings={},clientPhases={};
var main=document.getElementById('main');

function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function parseD(s){if(!s)return null;var p=String(s).slice(0,10).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysUntil(s){var d=parseD(s);return d?Math.round((d-today())/86400000):null}
function fmtD(s){var d=parseD(s);return d?d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}):'—'}
function fmtShort(s){var d=parseD(s);return d?d.toLocaleDateString('en-AU',{day:'numeric',month:'short'}):'—'}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}

// ── Runway: days of program left in TeamBuildr ──
function runway(c){
  var n=daysUntil(c.programmed_until);
  if(n===null)return{cls:'grey',n:null,txt:'Not set',rank:-1};
  if(n<0)return{cls:'red',n:n,txt:'Ran out '+(-n)+'d ago',rank:n};
  if(n<7)return{cls:'red',n:n,txt:n===0?'Last session today':n+'d left',rank:n};
  if(n<=14)return{cls:'amber',n:n,txt:n+'d left',rank:n};
  return{cls:'green',n:n,txt:n+'d left',rank:n};
}
// ── Where they're up to in the block ──
function blockPos(c){
  var s=parseD(c.block_start);if(!s)return null;
  var wk=Math.floor((today()-s)/(7*86400000))+1,len=+c.block_weeks||null;
  var end=null;if(len){end=new Date(s);end.setDate(s.getDate()+len*7-1);}
  if(wk<1)return{txt:'Starts '+fmtShort(c.block_start),end:end};
  if(len&&wk>len)return{txt:'Block finished',end:end,over:true};
  return{txt:'Week '+wk+(len?' of '+len:''),end:end};
}

// ── Load (same EWMA as Frisbee Track's Sport Sci tab, on HSR) ──
function calcLoad(rows){
  var t=today(),start=new Date(t);start.setDate(t.getDate()-41);
  var daily=new Array(42).fill(0),wk={hsr:0,n:0},last=null;
  rows.forEach(function(r){
    var s=r.data||{};var d=parseD(s.date);if(!d)return;
    if(!last||d>last)last=d;
    var i=Math.round((d-start)/86400000);
    if(i>=0&&i<42)daily[i]+=(+s.hsr||0);
    if(i>=35&&i<42){wk.hsr+=(+s.hsr||0);wk.n++;}
  });
  var a=0,c=0,la=2/8,lc=2/29;
  daily.forEach(function(v){a=v*la+a*(1-la);c=v*lc+c*(1-lc)});
  return{wk:wk,ratio:c>0?a/c:null,last:last};
}
function zone(r){
  if(r===null||!isFinite(r))return{cls:'muted',l:'Not enough data'};
  if(r<0.8)return{cls:'amber',l:'Low load'};if(r<0.9)return{cls:'',l:'Taper/recovery'};
  if(r<=1.1)return{cls:'green',l:'Sweet spot'};if(r<=1.3)return{cls:'',l:'Build'};
  if(r<=1.5)return{cls:'amber',l:'High load'};return{cls:'red',l:'Spike'};
}

// ── API (passphrase-protected edge function) ──
async function api(action,payload){
  var res=await fetch(SUPABASE_URL+'/functions/v1/roster-api',{method:'POST',
    headers:{'Content-Type':'application/json','x-roster-key':rkey,'apikey':SUPABASE_ANON_KEY},
    body:JSON.stringify(Object.assign({action:action},payload||{}))});
  var j={};try{j=await res.json()}catch(e){}
  if(res.status===401){forget();throw new Error('Wrong passphrase')}
  if(!res.ok)throw new Error(j.error||('Error '+res.status));
  return j;
}
// ── Data ──
async function load(){
  var d;
  try{d=await api('list')}catch(e){if(rkey)main.innerHTML='<div class="empty">Couldn\'t load clients: '+esc(e.message)+'</div>';return}
  clients=d.clients||[];appUsers=d.users||[];
  notes={};(d.notes||[]).forEach(function(x){(notes[x.client_id]=notes[x.client_id]||[]).push(x)});
  teamMembers=d.teamMembers||{};teamCodes=d.teamCodes||[];todos=d.todos||[];
  var by={};(d.sessions||[]).forEach(function(x){(by[x.user_id]=by[x.user_id]||[]).push(x)});sessBy=by;athletes=d.athletes||{};profiles=d.profiles||{};teamSettings=d.teamSettings||{};clientPhases=d.clientPhases||{};ciBy={};(d.checkins||[]).forEach(function(x){(ciBy[x.user_id]=ciBy[x.user_id]||[]).push(x)});
  loads={};
  clients.forEach(function(c){if(c.app_user_id)loads[c.app_user_id]=calcLoad(by[c.app_user_id]||[])});
  Object.keys(teamMembers).forEach(function(k){teamMembers[k].forEach(function(id){if(!loads[id])loads[id]=calcLoad(by[id]||[])})});
  document.getElementById('addBtn').style.display='';
  document.getElementById('tabs').style.display='flex';
  try{tab=localStorage.getItem('dbsp_roster_tab')||'client'}catch(e){}
  render();if(tdashId)renderTeamDash();
}

function kindOf(c){return c.kind||'client'}
function setTab(t){tab=t;try{localStorage.setItem('dbsp_roster_tab',t)}catch(e){}render();window.scrollTo(0,0)}
function render(){
  if(tab==='todo')return renderTodos();
  main.classList.remove('wide');
  var isTeam=tab==='team',noun=isTeam?'team':'client';
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
  document.getElementById('addBtn').textContent=isTeam?'+ Team':'+ Client';
  var hdr=document.querySelector('header');if(hdr)document.documentElement.style.setProperty('--hdrh',hdr.offsetHeight+'px');
  var all=clients.filter(function(c){return kindOf(c)===tab});
  var active=all.filter(function(c){return c.status==='active'});
  var rw=active.map(function(c){return{c:c,r:runway(c)}});
  var red=rw.filter(function(x){return x.r.cls==='red'}).length,amber=rw.filter(function(x){return x.r.cls==='amber'}).length,unset=rw.filter(function(x){return x.r.cls==='grey'}).length;
  var h='<div class="stats">'
   +'<div class="stat"><div class="k">Active '+noun+'s</div><div class="v">'+active.length+'</div></div>'
   +'<div class="stat"><div class="k">Program this week</div><div class="v '+(red?'red':'')+'">'+red+'</div></div>'
   +'<div class="stat"><div class="k">Due in 2 weeks</div><div class="v '+(amber?'amber':'')+'">'+amber+'</div></div>'
   +'<div class="stat"><div class="k">No date set</div><div class="v">'+unset+'</div></div></div>';
  var q=rw.filter(function(x){return x.r.cls!=='green'}).sort(function(a,b){return a.r.rank-b.r.rank});
  if(q.length){
    h+='<div class="sect">Needs programming</div><div class="queue">'+q.map(function(x){
      return '<div class="qrow" onclick="jump(\''+x.c.id+'\')"><span class="n">'+esc(x.c.name)+'</span>'
        +'<span class="d">'+(x.c.programmed_until?'to '+fmtShort(x.c.programmed_until):'')+'</span><span class="pill '+x.r.cls+'">'+x.r.txt+'</span></div>';
    }).join('')+'</div>';
  }
  if(!isTeam){
    var fl=active.filter(function(c){return c.app_user_id}).map(function(c){return{c:c,a:ftAnalyse(c)}}).filter(function(x){return x.a.flags.some(function(f){return f.cls!=='ok'})});
    if(fl.length){
      h+='<div class="sect">Frisbee Track flags</div><div class="queue">'+fl.map(function(x){
        var top=x.a.flags.filter(function(f){return f.cls!=='ok'})[0];
        return '<div class="qrow" onclick="jump(\''+x.c.id+'\')"><span class="n">'+esc(x.c.name)+'</span><span class="d">'+esc(top.t)+'</span><span class="pill '+(top.cls==='red'?'red':'amber')+'">'+x.a.flags.filter(function(f){return f.cls!=='ok'}).length+'</span></div>';
      }).join('')+'</div>';
    }
  }
  h+='<div class="bar">'+['active','paused','ended','all'].map(function(f){return '<button class="chip'+(filter===f?' on':'')+'" onclick="setFilter(\''+f+'\')">'+f+'</button>'}).join('')+'</div>';
  var list=all.filter(function(c){return filter==='all'||c.status===filter});
  if(!list.length)h+='<div class="empty">'+(all.length?'No '+filter+' '+noun+'s.':'No '+noun+'s yet. Tap <b>+ '+(isTeam?'Team':'Client')+'</b> to add your first one.')+'</div>';
  list.forEach(function(c){h+=card(c)});
  main.innerHTML=h;
}
function card(c){
  var r=runway(c),bp=blockPos(c),L=c.app_user_id?loads[c.app_user_id]:null,t=daysUntil(c.tournament_date);
  var ns=notes[c.id]||[],shown=expanded[c.id]?ns:ns.slice(0,2);
  return '<div class="card '+(c.status==='active'?r.cls:'off')+'" id="c-'+c.id+'"><div class="ctop"><div>'
    +'<div class="cname">'+esc(c.name)+'</div>'
    +'<div class="cmeta">'+(kindOf(c)==='team'
        ?'<span class="tag">Team</span>'+[c.team,c.squad_size?c.squad_size+' players':'',c.contact?'Contact: '+c.contact:''].filter(Boolean).map(esc).join(' · ')
        :'<span class="tag">'+esc(OFFER_LABEL[c.offer]||c.offer)+'</span>'+(c.team?esc(c.team):''))
      +(c.status!=='active'?' · '+esc(c.status):'')+'</div></div>'
    +'<div class="sp"></div><div class="acts">'+(kindOf(c)==='team'?'<button class="btn sm p" onclick="openTeam(\''+c.id+'\')">Squad dashboard</button>':'')+'<button class="btn sm'+(kindOf(c)==='team'?'':' p')+'" onclick="openProg(\''+c.id+'\')">Programmed to…</button><button class="btn sm" onclick="openEditor(\''+c.id+'\')">Edit</button></div></div>'
    +'<div class="grid">'
    +'<div class="cell"><div class="k">TeamBuildr runway</div><div class="v"><span class="big '+r.cls+'">'+r.txt+'</span>'
      +(c.programmed_until?'<br>Programmed to '+fmtD(c.programmed_until):'')+'</div></div>'
    +'<div class="cell"><div class="k">Where they\'re up to</div><div class="v">'
      +(c.block_name||c.phase||bp?(c.block_name?esc(c.block_name):'Current block')+(bp?' · <span class="'+(bp.over?'amber':'')+'">'+bp.txt+'</span>':'')
        +(c.phase?'<br>'+esc(c.phase):'')+(bp&&bp.end?'<br>Block ends '+fmtShort(iso(bp.end)):''):'<span class="muted">No block set</span>')
      +(c.next_tournament||c.tournament_date?'<br>'+esc(c.next_tournament||'Tournament')+(t!==null?' · '+(t>=0?t+'d out':'passed'):''):'')+'</div></div>'
    +(kindOf(c)==='team'?'<div class="cell"><div class="k">Frisbee Track squad</div><div class="v">'+teamLoadCell(c)+'</div></div>':'')
    +phaseCell(c)
    +'</div>'
    +(kindOf(c)==='client'?ftPanel(c):'')
    +(c.goals?'<div class="goals"><b>Goals:</b> '+esc(c.goals)+'</div>':'')
    +'<div class="log"><div class="k">Change log</div>'
    +(shown.length?shown.map(function(x){return '<div class="note"><span class="dt">'+fmtShort(x.created_at)+'</span><span>'+esc(x.note)+'</span></div>'}).join(''):'<div class="note muted">No notes yet</div>')
    +(ns.length>2?'<button class="link" onclick="toggleNotes(\''+c.id+'\')">'+(expanded[c.id]?'Show less':'Show all '+ns.length)+'</button>':'')
    +'<form class="addnote" onsubmit="addNote(event,\''+c.id+'\')"><input placeholder="Add a note, e.g. swapped RDLs for hip thrusts (hamstring)" maxlength="300"><button class="btn sm">Add</button></form></div>'
    +'</div>';
}
function teamKeyOf(c){var t=teamCodes.find(function(x){return c.team_code&&String(x.code).toUpperCase()===String(c.team_code).toUpperCase()});return t&&t.team_key||null}
function phaseChips(cur,onclickArg){return [['p1','Phase 1'],['p2','Phase 2'],['p3','Phase 3']].map(function(o){return '<button class="chip'+(cur===o[0]?' on':'')+'" style="padding:5px 9px;margin:2px 4px 0 0" onclick="setFcPhase('+onclickArg+',\''+o[0]+'\')">'+o[1]+'</button>'}).join('')}
async function setFcPhase(kind,key,ph){
  try{await api('fc_phase',kind==='team'?{team_key:key,fc_phase:ph}:{user_id:key,fc_phase:ph})}catch(err){toast(err.message);return}
  toast('F&C phase set');await load();
}
function phaseCell(c){
  if(kindOf(c)==='team'){var tk=teamKeyOf(c);if(!tk)return '';
    return '<div class="cell"><div class="k">F&amp;C phase · whole team</div><div class="v">'+phaseChips(teamSettings[tk]||'p1','\'team\',\''+tk+'\'')+'</div></div>';}
  if(!c.app_user_id)return '';
  var cur=clientPhases[c.app_user_id]||'p1';
  return '<div class="cell"><div class="k">F&amp;C phase (DBSP program)</div><div class="v">'+phaseChips(cur,'\'client\',\''+c.app_user_id+'\'')+'</div></div>';
}
function teamLoadCell(c){
  if(!c.team_code)return '<span class="muted">No team code linked</span>';
  var ids=teamMembers[String(c.team_code).toUpperCase()]||[];
  if(!ids.length)return '<span class="muted">No players on '+esc(c.team_code)+' yet</span>';
  var Ls=ids.map(function(id){return loads[id]}).filter(Boolean);
  var active7=Ls.filter(function(L){return L.wk.n>0}).length;
  var rs=Ls.map(function(L){return L.ratio}).filter(function(r){return r!==null&&isFinite(r)});
  var avg=rs.length?rs.reduce(function(a,b){return a+b},0)/rs.length:null,z=zone(avg);
  var spike=rs.filter(function(r){return r>1.5}).length,low=rs.filter(function(r){return r<0.8}).length;

  h+='<div class="mchips">'+['dist','hsr','vhsr','acc','hacc','dec'].map(function(k){return '<button class="chip'+(tdMetric===k?' on':'')+'" onclick="tdSet(\'m\',\''+k+'\')">'+mLbl[k]+'</button>'}).join('')+'</div>';
  // Chart 1: week to date per player
  var c1=P.slice().sort(function(x,y){return(y.pct(tdMetric)||0)-(x.pct(tdMetric)||0)});
  h+='<div class="td-grid"><div class="td-card"><h4>This week · '+mLbl[tdMetric]+' vs target <span>| = expected by today · faint line = 100%</span></h4>'
    +c1.map(function(p){var v=p.pct(tdMetric),w=v===null?0:Math.min(150,v*100)/1.5;var cls=v===null||!p.a.cur.tot.n?'none':v>1.15?'over':v>=0.9?'done':'';
      return '<div class="hb"><span class="n">'+esc(p.name)+'</span><div class="bar"><u style="left:66.7%"></u><i class="'+cls+'" style="width:'+w.toFixed(1)+'%"></i><s style="left:'+(pace*100/1.5).toFixed(1)+'%"></s></div><span class="v '+(v>1.15?'amber':'')+'">'+(p.a.cur.tot.n?pcTxt(v):'—')+'</span></div>'}).join('')
    +'</div>';
  // Chart 2: 6-week squad trend
  var wk=[0,1,2,3,4,5].map(function(i){var vals=P.map(function(p){var w=p.a.weeks[i];return w.tg[tdMetric]&&w.tot.n?w.tot[tdMetric]/w.tg[tdMetric]:null}).filter(function(v){return v!==null});
    var avg=vals.length?vals.reduce(function(a,b){return a+b},0)/vals.length:null;return{ws:P[0].a.weeks[i].ws,band:P[0].a.weeks[i].band,avg:avg,min:vals.length?Math.min.apply(null,vals):null,max:vals.length?Math.max.apply(null,vals):null,n:vals.length}});
  var mx=Math.max(1.3,Math.max.apply(null,wk.map(function(w){return w.max||0})));
  h+='<div class="td-card"><h4>Squad · 6-week '+mLbl[tdMetric]+' <span>avg % of target · line = range</span></h4><div class="vt"><div class="line" style="bottom:'+(100/mx*0.85).toFixed(1)+'%"></div>'
    +wk.map(function(w,i){if(w.avg===null)return '<div class="col"><span class="p" style="color:var(--t4)">—</span></div>';
      return '<div class="col"><span class="p">'+Math.round(w.avg*100)+'%</span><div class="b'+(i===5?' cur':'')+'" style="height:'+(w.avg/mx*85).toFixed(1)+'%"></div>'
      +'<div class="rg" style="bottom:'+(w.min/mx*85).toFixed(1)+'%;height:'+Math.max(1,(w.max-w.min)/mx*85).toFixed(1)+'%"></div></div>'}).join('')
    +'</div><div class="vt-l">'+wk.map(function(w,i){return '<span>'+(i===5?'Now':fmtShort(iso(w.ws)))+'<br>'+esc(bandName(w.band,c.tournament_date?Math.ceil((parseD(c.tournament_date)-w.ws)/(7*86400000)):null))+' · '+w.n+'</span>'}).join('')+'</div></div></div>';
  // Player table
  var th=function(k,l){return '<th onclick="tdSet(\'s\',\''+k+'\')">'+l+(tdSort===k?' ▾':'')+'</th>'};
  h+='<div class="td-card" style="margin-top:12px"><h4>Players <span>tap a player for their full panel</span></h4><div class="tbl-wrap"><table class="sq"><thead><tr>'
    +th('name','Player')+'<th>Sess</th><th>Dist</th><th>HSR</th><th>VHSR</th><th>Acc</th>'+th('ratio','Ratio')+'<th>Last log</th><th>Check-in</th><th>Niggle</th>'+th('attention','Flags')+'</tr></thead><tbody>'
    +sorted.map(function(p){var a=p.a,zz=zone(a.rH),top=p.flags[0];
      var dcls=(tdSel===p.uid?'':'')+(p.flags.some(function(f){return f.cls==='red'})?'red':p.flags.length?'amber':a.S.length?'':'grey');
      var row='<tr class="pl'+(tdSel===p.uid?' on':'')+'" onclick="tdToggle(\''+p.uid+'\')"><td class="nm"><span class="dot '+dcls+'"></span>'+(profiles[p.uid]&&profiles[p.uid].jersey?'<span class="jn">#'+esc(profiles[p.uid].jersey)+'</span>':'')+esc(p.name)+(profiles[p.uid]&&profiles[p.uid].position?'<span class="pos">'+esc(POS_LBL[profiles[p.uid].position]||'')+'</span>':'')+'</td><td>'+a.cur.tot.n+'</td>'
        +['dist','hsr','vhsr','acc'].map(function(k){var v=a.cur.tot.n?p.pct(k):null;return '<td><span class="pc '+pcCls(v)+'">'+pcTxt(v)+'</span></td>'}).join('')
        +'<td><span class="pc" style="color:'+(zz.cls==='red'?'var(--red)':zz.cls==='amber'?'#b07800':zz.cls==='green'?'var(--green)':'var(--t3)')+'">'+(a.rH!==null?a.rH.toFixed(2):'—')+'</span></td>'
        +'<td>'+(a.last?(a.ago===0?'Today':a.ago+'d'):'—')+'</td>'
        +'<td>'+(a.lastCi?(a.ciAgo===0?esc(FEEL_LBL[a.lastCi.feeling])+(a.lastCi.sleep_hrs!=null?' · '+(+a.lastCi.sleep_hrs<6?'<6':+a.lastCi.sleep_hrs>=9?'9+':+a.lastCi.sleep_hrs)+'h':''):'<span class="muted">'+a.ciAgo+'d ago</span>'):'<span class="muted">—</span>')+'</td>'
        +'<td>'+(a.activeNig.length?'<span class="pc '+(a.activeNig.some(function(n){return +n.sev>=5})?'hi':'lo')+'" style="'+(a.activeNig.some(function(n){return +n.sev>=5})?'color:var(--red)':'color:#b07800')+'">'+esc(nigTxt(a.activeNig.slice().sort(function(x,y){return y.sev-x.sev})[0]))+(a.activeNig.length>1?' +'+(a.activeNig.length-1):'')+'</span>':'<span class="muted">—</span>')+'</td><td class="fl">'+(top?esc(top.t)+(p.flags.length>1?' <span class="muted">+'+(p.flags.length-1)+'</span>':''):'<span class="muted">On track</span>')+'</td></tr>';
      return row}).join('')
    +'</tbody></table></div></div>';
  var sel=tdSel&&P.find(function(p){return p.uid===tdSel});
  if(sel){var pr=profiles[sel.uid]||{},u=appUsers.find(function(x){return x.user_id===sel.uid})||{};
    h+='<div class="td-card" id="tdSel" style="margin-top:12px;scroll-margin-top:70px"><h4>'+esc(sel.name)+' <span>'+esc(u.email||'')+' · <button class="link" onclick="tdToggle(\''+sel.uid+'\')">Close</button></span></h4>'
      +'<div class="ed-row"><div class="full"><label>Name</label><input id="ed-name" maxlength="60" value="'+esc(pr.display_name||sel.name)+'"></div>'
      +'<div><label>Jersey</label><input id="ed-jersey" maxlength="3" inputmode="numeric" value="'+esc(pr.jersey||'')+'"></div>'
      +'<div><label>Position</label><select id="ed-pos"><option value="">—</option>'+['handler','cutter','hybrid'].map(function(k){return '<option value="'+k+'"'+(pr.position===k?' selected':'')+'>'+POS_LBL[k]+'</option>'}).join('')+'</select></div>'
      +'<div><button class="btn sm p" onclick="savePlayer(\''+sel.uid+'\')">Save</button></div></div>'
      +ftPanel(sel.pc)+'</div>';}
  h+='</div>';
  document.getElementById('tdash').innerHTML=h;
}
var ftWk={},FT_MAXWK=25;
function ftWeek(id,o){ftWk[id]=Math.max(0,Math.min(FT_MAXWK,o));if(tdashId)renderTeamDash();else{render();jump(id)}}
function ftToggle(id){ftOpen[id]=!ftOpen[id];if(tdashId)renderTeamDash();else{render();jump(id)}}
function setFilter(f){filter=f;render()}
function toggleNotes(id){expanded[id]=!expanded[id];render();jump(id)}
function jump(id){if(filter!=='all'&&filter!=='active'){filter='active';render()}var el=document.getElementById('c-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}

// ── To-dos ──
var SECTION_ORDER=['Coaching + leads','DBSP website + funnel','Frisbee Track app'];
function onAdd(){if(tab==='todo')openTodo();else openEditor()}
function sections(){var s=SECTION_ORDER.slice();todos.forEach(function(t){if(t.section&&s.indexOf(t.section)<0)s.push(t.section)});return s}
function renderTodos(){
  main.classList.add('wide');
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t==='todo')});
  document.getElementById('addBtn').textContent='+ To-do';
  var hdr=document.querySelector('header');if(hdr)document.documentElement.style.setProperty('--hdrh',hdr.offsetHeight+'px');
  var cnt=function(s){return todos.filter(function(t){return t.status===s}).length};
  var overdue=todos.filter(function(t){var n=daysUntil(t.due_date);return t.status==='open'&&n!==null&&n<0}).length;
  var h='<div class="stats">'
   +'<div class="stat"><div class="k">Open</div><div class="v">'+cnt('open')+'</div></div>'
   +'<div class="stat"><div class="k">Overdue</div><div class="v '+(overdue?'red':'')+'">'+overdue+'</div></div>'
   +'<div class="stat"><div class="k">Later</div><div class="v">'+cnt('later')+'</div></div>'
   +'<div class="stat"><div class="k">Done</div><div class="v">'+cnt('done')+'</div></div></div>';
  var secs=sections();
  h+='<div class="bar">'+['open','later','done','all'].map(function(f){return '<button class="chip'+(tFilter===f?' on':'')+'" onclick="setTFilter(\''+f+'\')">'+f+'</button>'}).join('')+'</div>';
  var list=todos.filter(function(t){return tFilter==='all'||t.status===tFilter||(tFilter==='done'&&t.status==='dropped')});
  // one pillar per stream, side by side (swipe across on a phone)
  h+='<div class="pillars" style="--cols:'+secs.length+'">';
  secs.forEach(function(s,si){
    var items=list.filter(function(t){return (t.section||'Other')===s});
    items.sort(function(a,b){var da=a.due_date||'9999',db=b.due_date||'9999';return da<db?-1:da>db?1:(a.sort-b.sort)});
    h+='<section class="pillar" aria-label="'+esc(s)+'"><div class="pillar-h"><b>'+esc(s)+'</b><span>'+items.length+' '+(tFilter==='all'?'total':tFilter)+'</span></div>'
      +(items.length?items.map(todoRow).join(''):'<div class="empty">Nothing '+(tFilter==='all'?'here':tFilter)+'.</div>')
      +'<form class="padd" onsubmit="pillarAdd(event,'+si+')"><input placeholder="+ Add to '+esc(s)+'" maxlength="200" aria-label="Add a to-do to '+esc(s)+'"></form></section>';
  });
  h+='</div>';
  main.innerHTML=h;
}
function todoRow(t){
  var n=daysUntil(t.due_date),due='';
  if(t.due_date){var cls=t.status!=='open'?'grey':n<0?'red':n<=3?'amber':'grey';due='<span class="pill '+cls+'">'+(n<0&&t.status==='open'?'Overdue · ':'Due ')+fmtShort(t.due_date)+'</span>'}
  return '<div class="td" data-s="'+t.status+'"><button class="tick" title="Mark done" onclick="toggleDone(\''+t.id+'\')">'+(t.status==='done'?'✓':'')+'</button>'
    +'<div class="bd" onclick="openTodo(\''+t.id+'\')"><div class="tt">'+(t.num?'<span class="tnum">#'+t.num+'</span>':'')+esc(t.title)+'</div>'
    +(t.detail?'<div class="tdet">'+esc(t.detail)+'</div>':'')
    +'<div class="tmeta">'+due+(t.needs_check?'<span class="pill amber">Check</span>':'')+(t.status==='later'?'<span class="pill grey">Later</span>':'')+(t.status==='dropped'?'<span class="pill grey">Dropped</span>':'')
    +(t.link?'<a href="'+esc(t.link)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Source</a>':'')+'</div></div></div>';
}
function setTFilter(f){tFilter=f;renderTodos()}
async function pillarAdd(e,si){
  e.preventDefault();var inp=e.target.querySelector('input'),v=inp.value.trim();if(!v)return;
  try{await api('todo_save',{todo:{title:v,section:sections()[si],status:'open'}})}catch(err){toast(err.message);return}
  toast('Added');await load();
}
async function quickAdd(e){
  e.preventDefault();var v=document.getElementById('qaT').value.trim();if(!v)return;
  try{await api('todo_save',{todo:{title:v,section:document.getElementById('qaS').value,status:'open'}})}catch(err){toast(err.message);return}
  toast('Added');await load();
}
async function toggleDone(id){
  var t=todos.find(function(x){return x.id===id});if(!t)return;
  var s=t.status==='done'?'open':'done';t.status=s;renderTodos();
  try{await api('todo_save',{id:id,todo:{status:s}})}catch(err){toast(err.message);await load();return}
  toast(s==='done'?'Done':'Reopened');
}
function openTodo(id){
  tEditing=id?todos.find(function(t){return t.id===id}):null;
  var f=document.getElementById('tForm');f.reset();
  document.getElementById('secList').innerHTML=sections().map(function(s){return '<option value="'+esc(s)+'">'}).join('');
  document.getElementById('tTitle').textContent=tEditing?'Edit to-do'+(tEditing.num?' #'+tEditing.num:''):'New to-do';
  document.getElementById('tDel').style.visibility=tEditing?'visible':'hidden';
  if(tEditing)Array.prototype.forEach.call(f.elements,function(el){if(el.name&&tEditing[el.name]!=null)el.value=String(tEditing[el.name])});
  else f.elements.section.value='Coaching + leads';
  document.getElementById('tScrim').classList.add('open');
}
function closeTodo(){document.getElementById('tScrim').classList.remove('open');tEditing=null}
async function saveTodo(e){
  e.preventDefault();var row={};
  Array.prototype.forEach.call(e.target.elements,function(el){if(!el.name)return;var v=el.value.trim();row[el.name]=v===''?null:v});
  row.needs_check=row.needs_check==='true';if(!row.section)row.section='Coaching + leads';if(!row.status)row.status='open';
  try{await api('todo_save',{id:tEditing?tEditing.id:null,todo:row})}catch(err){toast(err.message);return}
  closeTodo();toast('Saved');await load();
}
var tDelArmed=false;
async function deleteTodo(){
  var b=document.getElementById('tDel');
  if(!tDelArmed){tDelArmed=true;b.textContent='Tap again to delete';setTimeout(function(){tDelArmed=false;b.textContent='Delete'},3000);return}
  tDelArmed=false;b.textContent='Delete';
  try{await api('todo_delete',{id:tEditing.id})}catch(err){toast(err.message);return}
  closeTodo();toast('Deleted');await load();
}

// ── Actions ──
async function addNote(e,id){
  e.preventDefault();var inp=e.target.querySelector('input'),v=inp.value.trim();if(!v)return;
  try{await api('note',{id:id,note:v})}catch(err){toast(err.message);return}
  toast('Note added');await load();
}
function openProg(id){
  progId=id;var c=clients.find(function(x){return x.id===id});
  document.getElementById('pTitle').textContent=c.name+' · programmed to';
  document.getElementById('pDate').value=c.programmed_until||'';
  document.getElementById('pNote').value='';
  document.getElementById('pScrim').classList.add('open');
}
function closeProg(){document.getElementById('pScrim').classList.remove('open');progId=null}
function bump(days){
  var el=document.getElementById('pDate'),base=parseD(el.value),t=today();
  if(!base||base<t)base=t;base.setDate(base.getDate()+days);el.value=iso(base);
}
async function saveProg(){
  var v=document.getElementById('pDate').value||null,note=document.getElementById('pNote').value.trim();
  try{
    await api('save',{id:progId,client:{programmed_until:v}});
    await api('note',{id:progId,note:(note?note+' · ':'')+'Programmed to '+(v?fmtShort(v):'(cleared)')});
  }catch(err){toast(err.message);return}
  closeProg();toast('Updated');await load();
}
function openEditor(id){
  editing=id?clients.find(function(c){return c.id===id}):null;
  var f=document.getElementById('form');f.reset();
  var k=editing?kindOf(editing):tab;f.dataset.kind=k;document.getElementById('kindInp').value=k;
  document.getElementById('secLbl').textContent=k==='team'?'Team':'Client';
  f.querySelectorAll('[data-only] input,[data-only] select').forEach(function(el){el.disabled=el.closest('[data-only]').dataset.only!==k});
  document.getElementById('teamCodeSel').innerHTML='<option value="">None</option>'+teamCodes.map(function(t){return '<option value="'+esc(t.code)+'">'+esc(t.code)+(t.label?' · '+esc(t.label):'')+'</option>'}).join('');
  document.getElementById('appUserSel').innerHTML='<option value="">Not linked</option>'+appUsers.map(function(u){return '<option value="'+u.user_id+'">'+esc(u.email)+'</option>'}).join('');
  document.getElementById('formTitle').textContent=editing?'Edit '+editing.name:(k==='team'?'New team':'New client');
  document.getElementById('delBtn').style.visibility=editing?'visible':'hidden';
  if(editing)Array.prototype.forEach.call(f.elements,function(el){if(el.name&&!el.disabled&&el.name!=='kind'&&editing[el.name]!=null)el.value=editing[el.name]});
  document.getElementById('scrim').classList.add('open');
}
function closeEditor(){document.getElementById('scrim').classList.remove('open');editing=null}
async function saveClient(e){
  e.preventDefault();
  var row={};
  Array.prototype.forEach.call(e.target.elements,function(el){if(!el.name||el.disabled)return;var v=el.value.trim();
    row[el.name]=v===''?null:((el.name==='block_weeks'||el.name==='squad_size')?Number(v):v);});
  if(!row.offer)row.offer='coaching';if(!row.status)row.status='active';
  try{await api('save',{id:editing?editing.id:null,client:row})}catch(err){toast(err.message);return}
  closeEditor();toast('Saved');await load();
}
var delArmed=false;
async function deleteClient(){
  var b=document.getElementById('delBtn');
  if(!delArmed){delArmed=true;b.textContent='Tap again to delete';setTimeout(function(){delArmed=false;b.textContent='Delete'},3000);return}
  delArmed=false;b.textContent='Delete';
  try{await api('delete',{id:editing.id})}catch(err){toast(err.message);return}
  closeEditor();toast('Deleted');await load();
}

// ── Passphrase gate ──
function forget(){try{localStorage.removeItem(KEY_STORE)}catch(e){}rkey=null;document.getElementById('addBtn').style.display='none';document.getElementById('tabs').style.display='none';showGate('That passphrase didn\'t work. Try again.')}
function showGate(msg){
  main.innerHTML='<div class="gate"><h2>DBSP Hub</h2><p>'+(msg||'Enter your hub passphrase. This device will remember it.')+'</p>'
    +'<form onsubmit="unlock(event)" style="max-width:320px;margin:0 auto;display:flex;gap:8px"><input id="pp" type="password" autocomplete="current-password" placeholder="Passphrase" style="flex:1;font:15px DM Sans,sans-serif;padding:10px 12px;border:1.5px solid var(--bd2);border-radius:6px"><button class="btn p">Unlock</button></form></div>';
  setTimeout(function(){var el=document.getElementById('pp');if(el)el.focus()},50);
}
async function unlock(e){
  e.preventDefault();var v=document.getElementById('pp').value.trim();if(!v)return;
  rkey=v;main.innerHTML='<div class="empty">Checking…</div>';
  try{await api('ping')}catch(err){return}
  try{localStorage.setItem(KEY_STORE,v)}catch(e){}
  load();
}
function lock(){try{localStorage.removeItem(KEY_STORE)}catch(e){}rkey=null;document.getElementById('addBtn').style.display='none';document.getElementById('tabs').style.display='none';showGate()}
(function(){
  if(typeof SUPABASE_URL==='undefined'){main.innerHTML='<div class="empty">Couldn\'t connect to the database.</div>';return}
  try{rkey=localStorage.getItem(KEY_STORE)}catch(e){}
  if(rkey)load();else showGate();
})();
</script>
