<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DBSP Hub</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DBSP Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a3a5c">
<link rel="apple-touch-icon" href="roster-icon.png">
<link rel="icon" href="roster-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f2ee;--sf:#fff;--sf2:#faf9f6;--bd:rgba(26,58,92,.1);--bd2:rgba(26,58,92,.18);--navy:#1a3a5c;--mid:#2d62a0;--t:#14212f;--t2:#3b4a5a;--t3:#6b7785;--t4:#9aa3ad;--red:#c0392b;--amber:#b7791f;--green:#2f855a;--display:'Barlow Condensed',sans-serif}
body{background:var(--bg);color:var(--t);font:14px/1.45 'DM Sans',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
h1{font:900 22px/1 var(--display);letter-spacing:1.5px;text-transform:uppercase}
.hsub{font-size:11px;opacity:.7;margin-top:2px}
header .sp{flex:1}
.btn{font:800 12px var(--display);letter-spacing:.7px;text-transform:uppercase;border-radius:6px;padding:8px 14px;border:1.5px solid var(--bd2);background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
header .btn{background:#fff;color:var(--navy);border-color:#fff}
.btn.sm{padding:5px 10px;font-size:11px}
.btn.danger{color:var(--red);border-color:rgba(192,57,43,.35)}
main{max-width:980px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.stat .k{font:700 10px var(--display);letter-spacing:1.3px;text-transform:uppercase;color:var(--t3)}
.stat .v{font:800 28px/1.1 var(--display);margin-top:3px;color:var(--navy)}
.stat .v.red{color:var(--red)}.stat .v.amber{color:var(--amber)}
.sect{font:800 13px var(--display);letter-spacing:1.5px;text-transform:uppercase;color:var(--navy);margin:18px 0 8px}
.queue{background:#fff;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:6px}
.qrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--bd);cursor:pointer}
.qrow:first-child{border-top:none}
.qrow .n{font-weight:700;flex:1}
.qrow .d{font-size:12px;color:var(--t3)}
.pill{font:800 11px var(--display);letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-radius:12px;white-space:nowrap}
.pill.red{background:rgba(192,57,43,.12);color:var(--red)}.pill.amber{background:rgba(183,121,31,.14);color:var(--amber)}.pill.green{background:rgba(47,133,90,.12);color:var(--green)}.pill.grey{background:rgba(26,58,92,.08);color:var(--t3)}
.tabs{display:flex;background:var(--navy);padding:0 16px;gap:4px;position:sticky;top:var(--hdrh,64px);z-index:19}
.tab{font:800 13px var(--display);letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.6);background:none;border:none;border-bottom:3px solid transparent;padding:8px 14px 9px;cursor:pointer}
.tab.on{color:#fff;border-bottom-color:#fff}
.fg .f[data-only]{display:none}
form[data-kind=client] .fg .f[data-only=client],form[data-kind=team] .fg .f[data-only=team]{display:flex}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:18px 0 10px}
.chip{font:800 11px var(--display);letter-spacing:.7px;text-transform:uppercase;padding:6px 12px;border-radius:6px;border:1.5px solid var(--bd2);background:#fff;color:var(--t3);cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.card{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--bd2);border-radius:10px;padding:14px;margin-bottom:10px;scroll-margin-top:80px}
.card.red{border-left-color:var(--red)}.card.amber{border-left-color:var(--amber)}.card.green{border-left-color:var(--green)}
.card.off{opacity:.6}
.ctop{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.cname{font:800 20px/1.15 var(--display);letter-spacing:.3px;color:var(--navy)}
.cmeta{font-size:12px;color:var(--t3);margin-top:3px}
.tag{display:inline-block;font:700 10px var(--display);letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:rgba(45,98,160,.1);color:var(--mid);margin-right:4px}
.ctop .sp{flex:1}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:12px}
.cell{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:9px 11px}
.cell .k{font:700 10px var(--display);letter-spacing:1.2px;text-transform:uppercase;color:var(--t4);margin-bottom:3px}
.cell .v{font-size:13px;font-weight:600;color:var(--t2)}
.big{font:800 18px var(--display);letter-spacing:.3px}
.red{color:var(--red)}.amber{color:var(--amber)}.green{color:var(--green)}.muted{color:var(--t4);font-weight:500}
.log{margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}
.log .k{font:700 10px var(--display);letter-spacing:1.2px;text-transform:uppercase;color:var(--t4);margin-bottom:6px}
.note{font-size:13px;color:var(--t2);padding:4px 0;display:flex;gap:8px}
.note .dt{color:var(--t4);font-size:12px;white-space:nowrap;min-width:52px}
.addnote{display:flex;gap:6px;margin-top:6px}
.addnote input{flex:1;font:13px 'DM Sans',sans-serif;padding:7px 10px;border:1.5px solid var(--bd2);border-radius:6px;background:var(--sf2)}
.goals{font-size:12.5px;color:var(--t2);margin-top:10px}
.link{background:none;border:none;color:var(--mid);font-size:12px;font-weight:600;cursor:pointer;padding:2px 0}
.empty,.gate{text-align:center;color:var(--t3);padding:48px 16px}
.gate h2{font:800 22px var(--display);color:var(--navy);margin-bottom:8px;text-transform:uppercase}
.gate p{margin-bottom:16px}
.scrim{position:fixed;inset:0;background:rgba(20,33,47,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.sheet{border-radius:14px}}
.sheet h3{font:800 20px var(--display);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;color:var(--navy)}
.ssec{font:700 10px var(--display);letter-spacing:1.4px;text-transform:uppercase;color:var(--t3);margin:14px 0 6px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px}
.f.full{grid-column:1/-1}
.f label{font-size:11px;font-weight:600;color:var(--t3)}
.f input,.f select,.f textarea{font:14px 'DM Sans',sans-serif;padding:8px 10px;border:1.5px solid var(--bd2);border-radius:6px;background:var(--sf2);color:var(--t);width:100%}
.f textarea{min-height:60px;resize:vertical}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sheet-acts{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
.td{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--green);border-radius:10px;padding:11px 13px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.td[data-s=later]{border-left-color:var(--amber)}.td[data-s=done]{border-left-color:var(--t4);opacity:.6}.td[data-s=dropped]{border-left-color:var(--red);opacity:.45}
.td[data-s=done] .tt,.td[data-s=dropped] .tt{text-decoration:line-through}
.tick{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--bd2);background:#fff;cursor:pointer;margin-top:1px;font:800 13px/1 var(--display);color:#fff}
.td[data-s=done] .tick{background:var(--green);border-color:var(--green)}
.td .bd{flex:1;min-width:0;cursor:pointer}
.tt{font-weight:700;color:var(--t)}
.tdet{font-size:12.5px;color:var(--t3);margin-top:3px}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.tmeta a{font-size:12px;color:var(--mid)}
.quickadd{display:flex;gap:6px;margin:14px 0 4px}
.quickadd input{flex:1;font:14px 'DM Sans',sans-serif;padding:9px 11px;border:1.5px solid var(--bd2);border-radius:6px;background:#fff}
.quickadd select{font:13px 'DM Sans',sans-serif;padding:8px;border:1.5px solid var(--bd2);border-radius:6px;background:#fff;max-width:40%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div><h1>DBSP Hub</h1><div class="hsub">Clients, teams and to-dos</div></div>
  <div class="sp"></div>
  <button class="btn" id="addBtn" style="display:none" onclick="onAdd()">+ Client</button>
  <button class="btn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4)" onclick="lock()" title="Forget passphrase on this device">Lock</button>
</header>
<nav class="tabs" id="tabs" style="display:none"><button class="tab" data-t="client" onclick="setTab('client')">Clients</button><button class="tab" data-t="team" onclick="setTab('team')">Teams</button><button class="tab" data-t="todo" onclick="setTab('todo')">To-dos</button></nav>
<main id="main"><div class="empty">Loading…</div></main>

<!-- Client editor -->
<div class="scrim" id="scrim" onclick="if(event.target===this)closeEditor()">
  <form class="sheet" id="form" onsubmit="saveClient(event)">
    <h3 id="formTitle">New client</h3>
    <input type="hidden" name="kind" id="kindInp">
    <div class="ssec" id="secLbl">Client</div>
    <div class="fg">
      <div class="f"><label>Name</label><input name="name" required></div>
      <div class="f" data-only="client"><label>Team</label><input name="team" placeholder="e.g. Sunder"></div>
      <div class="f" data-only="team"><label>Division / competition</label><input name="team" disabled placeholder="e.g. AUC Open"></div>
      <div class="f" data-only="client"><label>Offer</label><select name="offer"><option value="coaching">Custom coaching</option><option value="rehab">Injury rehab</option><option value="speed">Speed sessions</option><option value="selfserve">Self-serve</option></select></div>
      <div class="f"><label>Status</label><select name="status"><option value="active">Active</option><option value="paused">Paused</option><option value="ended">Ended</option></select></div>
      <div class="f"><label>Started</label><input type="date" name="start_date"></div>
      <div class="f" data-only="client"><label>Frisbee Track account</label><select name="app_user_id" id="appUserSel"><option value="">Not linked</option></select></div>
      <div class="f" data-only="team"><label>Frisbee Track team code</label><select name="team_code" id="teamCodeSel"><option value="">None</option></select></div>
      <div class="f" data-only="team"><label>Squad size</label><input type="number" name="squad_size" min="1" max="60"></div>
      <div class="f" data-only="team"><label>Main contact</label><input name="contact" placeholder="e.g. Captain or coach"></div>
    </div>
    <div class="ssec">Program</div>
    <div class="fg">
      <div class="f full"><label>Programmed in TeamBuildr until</label><input type="date" name="programmed_until"></div>
      <div class="f"><label>Current block</label><input name="block_name" placeholder="e.g. Pre-season B2"></div>
      <div class="f"><label>Phase</label><input name="phase" placeholder="e.g. Strength-speed"></div>
      <div class="f"><label>Block started</label><input type="date" name="block_start"></div>
      <div class="f"><label>Block length (weeks)</label><input type="number" name="block_weeks" min="1" max="16"></div>
    </div>
    <div class="ssec">Season</div>
    <div class="fg">
      <div class="f"><label>Next tournament</label><input name="next_tournament" placeholder="e.g. Nationals"></div>
      <div class="f"><label>Tournament date</label><input type="date" name="tournament_date"></div>
      <div class="f full"><label>Goals</label><textarea name="goals"></textarea></div>
    </div>
    <div class="sheet-acts">
      <button type="button" class="btn danger" id="delBtn" onclick="deleteClient()">Delete</button>
      <div style="display:flex;gap:8px;margin-left:auto"><button type="button" class="btn" onclick="closeEditor()">Cancel</button><button class="btn p" type="submit">Save</button></div>
    </div>
  </form>
</div>

<!-- Quick "programmed until" update -->
<div class="scrim" id="pScrim" onclick="if(event.target===this)closeProg()">
  <div class="sheet">
    <h3 id="pTitle">Programmed until</h3>
    <div class="f"><label>Last date with a session in TeamBuildr</label><input type="date" id="pDate"></div>
    <div class="quick">
      <button class="btn sm" onclick="bump(7)">+1 wk</button><button class="btn sm" onclick="bump(14)">+2 wk</button>
      <button class="btn sm" onclick="bump(28)">+4 wk</button><button class="btn sm" onclick="bump(42)">+6 wk</button>
    </div>
    <div class="f" style="margin-top:12px"><label>Note (optional)</label><input id="pNote" placeholder="e.g. Wrote pre-season B3"></div>
    <div class="sheet-acts"><span></span><div style="display:flex;gap:8px"><button class="btn" onclick="closeProg()">Cancel</button><button class="btn p" onclick="saveProg()">Save</button></div></div>
  </div>
</div>
<!-- To-do editor -->
<div class="scrim" id="tScrim" onclick="if(event.target===this)closeTodo()">
  <form class="sheet" id="tForm" onsubmit="saveTodo(event)">
    <h3 id="tTitle">New to-do</h3>
    <div class="fg">
      <div class="f full"><label>To-do</label><input name="title" required maxlength="200"></div>
      <div class="f"><label>Section</label><input name="section" list="secList" placeholder="e.g. Coaching + leads"><datalist id="secList"></datalist></div>
      <div class="f"><label>Status</label><select name="status"><option value="open">Open</option><option value="later">Later</option><option value="done">Done</option><option value="dropped">Dropped</option></select></div>
      <div class="f"><label>Due (optional)</label><input type="date" name="due_date"></div>
      <div class="f"><label>Needs checking?</label><select name="needs_check"><option value="false">No</option><option value="true">Yes, may already be done</option></select></div>
      <div class="f full"><label>Details</label><textarea name="detail"></textarea></div>
      <div class="f full"><label>Link (optional)</label><input name="link" type="url" placeholder="e.g. the Claude chat it came from"></div>
    </div>
    <div class="sheet-acts">
      <button type="button" class="btn danger" id="tDel" onclick="deleteTodo()">Delete</button>
      <div style="display:flex;gap:8px;margin-left:auto"><button type="button" class="btn" onclick="closeTodo()">Cancel</button><button class="btn p" type="submit">Save</button></div>
    </div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
var COACH_UID='c0b4da2f-8ee8-4926-8b27-0d095cab8e17';
var OFFER_LABEL={coaching:'Custom coaching',rehab:'Injury rehab',speed:'Speed sessions',selfserve:'Self-serve'};
var KEY_STORE='dbsp_roster_key',tab='client',teamMembers={},teamCodes=[],byUser={},rkey=null,clients=[],notes={},appUsers=[],loads={},filter='active',editing=null,progId=null,expanded={},todos=[],tFilter='open',tEditing=null;
var main=document.getElementById('main');

function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function parseD(s){if(!s)return null;var p=String(s).slice(0,10).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysUntil(s){var d=parseD(s);return d?Math.round((d-today())/86400000):null}
function fmtD(s){var d=parseD(s);return d?d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}):'—'}
function fmtShort(s){var d=parseD(s);return d?d.toLocaleDateString('en-AU',{day:'numeric',month:'short'}):'—'}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}

// ── Runway: days of program left in TeamBuildr ──
function runway(c){
  var n=daysUntil(c.programmed_until);
  if(n===null)return{cls:'grey',n:null,txt:'Not set',rank:-1};
  if(n<0)return{cls:'red',n:n,txt:'Ran out '+(-n)+'d ago',rank:n};
  if(n<7)return{cls:'red',n:n,txt:n===0?'Last session today':n+'d left',rank:n};
  if(n<=14)return{cls:'amber',n:n,txt:n+'d left',rank:n};
  return{cls:'green',n:n,txt:n+'d left',rank:n};
}
// ── Where they're up to in the block ──
function blockPos(c){
  var s=parseD(c.block_start);if(!s)return null;
  var wk=Math.floor((today()-s)/(7*86400000))+1,len=+c.block_weeks||null;
  var end=null;if(len){end=new Date(s);end.setDate(s.getDate()+len*7-1);}
  if(wk<1)return{txt:'Starts '+fmtShort(c.block_start),end:end};
  if(len&&wk>len)return{txt:'Block finished',end:end,over:true};
  return{txt:'Week '+wk+(len?' of '+len:''),end:end};
}

// ── Load (same EWMA as Frisbee Track's Sport Sci tab, on HSR) ──
function calcLoad(rows){
  var t=today(),start=new Date(t);start.setDate(t.getDate()-41);
  var daily=new Array(42).fill(0),wk={hsr:0,n:0},last=null;
  rows.forEach(function(r){
    var s=r.data||{};var d=parseD(s.date);if(!d)return;
    if(!last||d>last)last=d;
    var i=Math.round((d-start)/86400000);
    if(i>=0&&i<42)daily[i]+=(+s.hsr||0);
    if(i>=35&&i<42){wk.hsr+=(+s.hsr||0);wk.n++;}
  });
  var a=0,c=0,la=2/8,lc=2/29;
  daily.forEach(function(v){a=v*la+a*(1-la);c=v*lc+c*(1-lc)});
  return{wk:wk,ratio:c>0?a/c:null,last:last};
}
function zone(r){
  if(r===null||!isFinite(r))return{cls:'muted',l:'Not enough data'};
  if(r<0.8)return{cls:'amber',l:'Low load'};if(r<0.9)return{cls:'',l:'Taper/recovery'};
  if(r<=1.1)return{cls:'green',l:'Sweet spot'};if(r<=1.3)return{cls:'',l:'Build'};
  if(r<=1.5)return{cls:'amber',l:'High load'};return{cls:'red',l:'Spike'};
}

// ── API (passphrase-protected edge function) ──
async function api(action,payload){
  var res=await fetch(SUPABASE_URL+'/functions/v1/roster-api',{method:'POST',
    headers:{'Content-Type':'application/json','x-roster-key':rkey,'apikey':SUPABASE_ANON_KEY},
    body:JSON.stringify(Object.assign({action:action},payload||{}))});
  var j={};try{j=await res.json()}catch(e){}
  if(res.status===401){forget();throw new Error('Wrong passphrase')}
  if(!res.ok)throw new Error(j.error||('Error '+res.status));
  return j;
}
// ── Data ──
async function load(){
  var d;
  try{d=await api('list')}catch(e){if(rkey)main.innerHTML='<div class="empty">Couldn\'t load clients: '+esc(e.message)+'</div>';return}
  clients=d.clients||[];appUsers=d.users||[];
  notes={};(d.notes||[]).forEach(function(x){(notes[x.client_id]=notes[x.client_id]||[]).push(x)});
  teamMembers=d.teamMembers||{};teamCodes=d.teamCodes||[];todos=d.todos||[];
  var by={};(d.sessions||[]).forEach(function(x){(by[x.user_id]=by[x.user_id]||[]).push(x)});
  loads={};
  clients.forEach(function(c){if(c.app_user_id)loads[c.app_user_id]=calcLoad(by[c.app_user_id]||[])});
  Object.keys(teamMembers).forEach(function(k){teamMembers[k].forEach(function(id){if(!loads[id])loads[id]=calcLoad(by[id]||[])})});
  document.getElementById('addBtn').style.display='';
  document.getElementById('tabs').style.display='flex';
  try{tab=localStorage.getItem('dbsp_roster_tab')||'client'}catch(e){}
  render();
}

function kindOf(c){return c.kind||'client'}
function setTab(t){tab=t;try{localStorage.setItem('dbsp_roster_tab',t)}catch(e){}render();window.scrollTo(0,0)}
function render(){
  if(tab==='todo')return renderTodos();
  var isTeam=tab==='team',noun=isTeam?'team':'client';
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
  document.getElementById('addBtn').textContent=isTeam?'+ Team':'+ Client';
  var hdr=document.querySelector('header');if(hdr)document.documentElement.style.setProperty('--hdrh',hdr.offsetHeight+'px');
  var all=clients.filter(function(c){return kindOf(c)===tab});
  var active=all.filter(function(c){return c.status==='active'});
  var rw=active.map(function(c){return{c:c,r:runway(c)}});
  var red=rw.filter(function(x){return x.r.cls==='red'}).length,amber=rw.filter(function(x){return x.r.cls==='amber'}).length,unset=rw.filter(function(x){return x.r.cls==='grey'}).length;
  var h='<div class="stats">'
   +'<div class="stat"><div class="k">Active '+noun+'s</div><div class="v">'+active.length+'</div></div>'
   +'<div class="stat"><div class="k">Program this week</div><div class="v '+(red?'red':'')+'">'+red+'</div></div>'
   +'<div class="stat"><div class="k">Due in 2 weeks</div><div class="v '+(amber?'amber':'')+'">'+amber+'</div></div>'
   +'<div class="stat"><div class="k">No date set</div><div class="v">'+unset+'</div></div></div>';
  var q=rw.filter(function(x){return x.r.cls!=='green'}).sort(function(a,b){return a.r.rank-b.r.rank});
  if(q.length){
    h+='<div class="sect">Needs programming</div><div class="queue">'+q.map(function(x){
      return '<div class="qrow" onclick="jump(\''+x.c.id+'\')"><span class="n">'+esc(x.c.name)+'</span>'
        +'<span class="d">'+(x.c.programmed_until?'to '+fmtShort(x.c.programmed_until):'')+'</span><span class="pill '+x.r.cls+'">'+x.r.txt+'</span></div>';
    }).join('')+'</div>';
  }
  h+='<div class="bar">'+['active','paused','ended','all'].map(function(f){return '<button class="chip'+(filter===f?' on':'')+'" onclick="setFilter(\''+f+'\')">'+f+'</button>'}).join('')+'</div>';
  var list=all.filter(function(c){return filter==='all'||c.status===filter});
  if(!list.length)h+='<div class="empty">'+(all.length?'No '+filter+' '+noun+'s.':'No '+noun+'s yet. Tap <b>+ '+(isTeam?'Team':'Client')+'</b> to add your first one.')+'</div>';
  list.forEach(function(c){h+=card(c)});
  main.innerHTML=h;
}
function card(c){
  var r=runway(c),bp=blockPos(c),L=c.app_user_id?loads[c.app_user_id]:null,t=daysUntil(c.tournament_date);
  var ns=notes[c.id]||[],shown=expanded[c.id]?ns:ns.slice(0,2);
  return '<div class="card '+(c.status==='active'?r.cls:'off')+'" id="c-'+c.id+'"><div class="ctop"><div>'
    +'<div class="cname">'+esc(c.name)+'</div>'
    +'<div class="cmeta">'+(kindOf(c)==='team'
        ?'<span class="tag">Team</span>'+[c.team,c.squad_size?c.squad_size+' players':'',c.contact?'Contact: '+c.contact:''].filter(Boolean).map(esc).join(' · ')
        :'<span class="tag">'+esc(OFFER_LABEL[c.offer]||c.offer)+'</span>'+(c.team?esc(c.team):''))
      +(c.status!=='active'?' · '+esc(c.status):'')+'</div></div>'
    +'<div class="sp"></div><div class="acts"><button class="btn sm p" onclick="openProg(\''+c.id+'\')">Programmed to…</button><button class="btn sm" onclick="openEditor(\''+c.id+'\')">Edit</button></div></div>'
    +'<div class="grid">'
    +'<div class="cell"><div class="k">TeamBuildr runway</div><div class="v"><span class="big '+r.cls+'">'+r.txt+'</span>'
      +(c.programmed_until?'<br>Programmed to '+fmtD(c.programmed_until):'')+'</div></div>'
    +'<div class="cell"><div class="k">Where they\'re up to</div><div class="v">'
      +(c.block_name||c.phase||bp?(c.block_name?esc(c.block_name):'Current block')+(bp?' · <span class="'+(bp.over?'amber':'')+'">'+bp.txt+'</span>':'')
        +(c.phase?'<br>'+esc(c.phase):'')+(bp&&bp.end?'<br>Block ends '+fmtShort(iso(bp.end)):''):'<span class="muted">No block set</span>')
      +(c.next_tournament||c.tournament_date?'<br>'+esc(c.next_tournament||'Tournament')+(t!==null?' · '+(t>=0?t+'d out':'passed'):''):'')+'</div></div>'
    +'<div class="cell"><div class="k">Frisbee Track'+(kindOf(c)==='team'?' squad':'')+'</div><div class="v">'+(kindOf(c)==='team'?teamLoadCell(c):loadCell(c,L))+'</div></div>'
    +'</div>'
    +(c.goals?'<div class="goals"><b>Goals:</b> '+esc(c.goals)+'</div>':'')
    +'<div class="log"><div class="k">Change log</div>'
    +(shown.length?shown.map(function(x){return '<div class="note"><span class="dt">'+fmtShort(x.created_at)+'</span><span>'+esc(x.note)+'</span></div>'}).join(''):'<div class="note muted">No notes yet</div>')
    +(ns.length>2?'<button class="link" onclick="toggleNotes(\''+c.id+'\')">'+(expanded[c.id]?'Show less':'Show all '+ns.length)+'</button>':'')
    +'<form class="addnote" onsubmit="addNote(event,\''+c.id+'\')"><input placeholder="Add a note, e.g. swapped RDLs for hip thrusts (hamstring)" maxlength="300"><button class="btn sm">Add</button></form></div>'
    +'</div>';
}
function teamLoadCell(c){
  if(!c.team_code)return '<span class="muted">No team code linked</span>';
  var ids=teamMembers[String(c.team_code).toUpperCase()]||[];
  if(!ids.length)return '<span class="muted">No players on '+esc(c.team_code)+' yet</span>';
  var Ls=ids.map(function(id){return loads[id]}).filter(Boolean);
  var active7=Ls.filter(function(L){return L.wk.n>0}).length;
  var rs=Ls.map(function(L){return L.ratio}).filter(function(r){return r!==null&&isFinite(r)});
  var avg=rs.length?rs.reduce(function(a,b){return a+b},0)/rs.length:null,z=zone(avg);
  var spike=rs.filter(function(r){return r>1.5}).length,low=rs.filter(function(r){return r<0.8}).length;
  return ids.length+' on app'+(c.squad_size?' of '+c.squad_size:'')+' · '+active7+' logged this week'
    +'<br>Avg ratio '+(avg!==null?avg.toFixed(2):'—')+' <span class="'+z.cls+'">'+z.l+'</span>'
    +(spike||low?'<br>'+(spike?'<span class="red">'+spike+' spiking</span>':'')+(spike&&low?' · ':'')+(low?'<span class="amber">'+low+' low</span>':''):'');
}
function loadCell(c,L){
  if(!c.app_user_id)return '<span class="muted">Not linked</span>';
  if(!L||!L.last)return '<span class="muted">No sessions logged</span>';
  var z=zone(L.ratio),ago=Math.round((today()-L.last)/86400000);
  return 'Last 7d: '+L.wk.n+' session'+(L.wk.n===1?'':'s')+' · HSR '+Math.round(L.wk.hsr)+'m'
    +'<br>Ratio '+(L.ratio!==null?L.ratio.toFixed(2):'—')+' <span class="'+z.cls+'">'+z.l+'</span>'
    +'<br><span class="'+(ago>7?'amber':'muted')+'">Last logged '+(ago===0?'today':ago+'d ago')+'</span>';
}
function setFilter(f){filter=f;render()}
function toggleNotes(id){expanded[id]=!expanded[id];render();jump(id)}
function jump(id){if(filter!=='all'&&filter!=='active'){filter='active';render()}var el=document.getElementById('c-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}

// ── To-dos ──
var SECTION_ORDER=['Coaching + leads','DBSP website + funnel','Frisbee Track app'];
function onAdd(){if(tab==='todo')openTodo();else openEditor()}
function sections(){var s=SECTION_ORDER.slice();todos.forEach(function(t){if(t.section&&s.indexOf(t.section)<0)s.push(t.section)});return s}
function renderTodos(){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t==='todo')});
  document.getElementById('addBtn').textContent='+ To-do';
  var hdr=document.querySelector('header');if(hdr)document.documentElement.style.setProperty('--hdrh',hdr.offsetHeight+'px');
  var cnt=function(s){return todos.filter(function(t){return t.status===s}).length};
  var overdue=todos.filter(function(t){var n=daysUntil(t.due_date);return t.status==='open'&&n!==null&&n<0}).length;
  var h='<div class="stats">'
   +'<div class="stat"><div class="k">Open</div><div class="v">'+cnt('open')+'</div></div>'
   +'<div class="stat"><div class="k">Overdue</div><div class="v '+(overdue?'red':'')+'">'+overdue+'</div></div>'
   +'<div class="stat"><div class="k">Later</div><div class="v">'+cnt('later')+'</div></div>'
   +'<div class="stat"><div class="k">Done</div><div class="v">'+cnt('done')+'</div></div></div>';
  var secs=sections();
  h+='<form class="quickadd" onsubmit="quickAdd(event)"><input id="qaT" placeholder="Add a to-do…" maxlength="200"><select id="qaS">'
    +secs.map(function(s){return '<option>'+esc(s)+'</option>'}).join('')+'</select><button class="btn p">Add</button></form>';
  h+='<div class="bar">'+['open','later','done','all'].map(function(f){return '<button class="chip'+(tFilter===f?' on':'')+'" onclick="setTFilter(\''+f+'\')">'+f+'</button>'}).join('')+'</div>';
  var list=todos.filter(function(t){return tFilter==='all'||t.status===tFilter||(tFilter==='done'&&t.status==='dropped')});
  if(!list.length)h+='<div class="empty">Nothing '+(tFilter==='all'?'here':tFilter)+'.</div>';
  secs.forEach(function(s){
    var items=list.filter(function(t){return (t.section||'Other')===s});if(!items.length)return;
    items.sort(function(a,b){var da=a.due_date||'9999',db=b.due_date||'9999';return da<db?-1:da>db?1:(a.sort-b.sort)});
    h+='<div class="sect">'+esc(s)+' <span class="muted" style="font-weight:600">· '+items.length+'</span></div>';
    items.forEach(function(t){h+=todoRow(t)});
  });
  main.innerHTML=h;
}
function todoRow(t){
  var n=daysUntil(t.due_date),due='';
  if(t.due_date){var cls=t.status!=='open'?'grey':n<0?'red':n<=3?'amber':'grey';due='<span class="pill '+cls+'">'+(n<0&&t.status==='open'?'Overdue · ':'Due ')+fmtShort(t.due_date)+'</span>'}
  return '<div class="td" data-s="'+t.status+'"><button class="tick" title="Mark done" onclick="toggleDone(\''+t.id+'\')">'+(t.status==='done'?'✓':'')+'</button>'
    +'<div class="bd" onclick="openTodo(\''+t.id+'\')"><div class="tt">'+esc(t.title)+'</div>'
    +(t.detail?'<div class="tdet">'+esc(t.detail)+'</div>':'')
    +'<div class="tmeta">'+due+(t.needs_check?'<span class="pill amber">Check</span>':'')+(t.status==='later'?'<span class="pill grey">Later</span>':'')+(t.status==='dropped'?'<span class="pill grey">Dropped</span>':'')
    +(t.link?'<a href="'+esc(t.link)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Source</a>':'')+'</div></div></div>';
}
function setTFilter(f){tFilter=f;renderTodos()}
async function quickAdd(e){
  e.preventDefault();var v=document.getElementById('qaT').value.trim();if(!v)return;
  try{await api('todo_save',{todo:{title:v,section:document.getElementById('qaS').value,status:'open'}})}catch(err){toast(err.message);return}
  toast('Added');await load();
}
async function toggleDone(id){
  var t=todos.find(function(x){return x.id===id});if(!t)return;
  var s=t.status==='done'?'open':'done';t.status=s;renderTodos();
  try{await api('todo_save',{id:id,todo:{status:s}})}catch(err){toast(err.message);await load();return}
  toast(s==='done'?'Done':'Reopened');
}
function openTodo(id){
  tEditing=id?todos.find(function(t){return t.id===id}):null;
  var f=document.getElementById('tForm');f.reset();
  document.getElementById('secList').innerHTML=sections().map(function(s){return '<option value="'+esc(s)+'">'}).join('');
  document.getElementById('tTitle').textContent=tEditing?'Edit to-do':'New to-do';
  document.getElementById('tDel').style.visibility=tEditing?'visible':'hidden';
  if(tEditing)Array.prototype.forEach.call(f.elements,function(el){if(el.name&&tEditing[el.name]!=null)el.value=String(tEditing[el.name])});
  else f.elements.section.value='Coaching + leads';
  document.getElementById('tScrim').classList.add('open');
}
function closeTodo(){document.getElementById('tScrim').classList.remove('open');tEditing=null}
async function saveTodo(e){
  e.preventDefault();var row={};
  Array.prototype.forEach.call(e.target.elements,function(el){if(!el.name)return;var v=el.value.trim();row[el.name]=v===''?null:v});
  row.needs_check=row.needs_check==='true';if(!row.section)row.section='Coaching + leads';if(!row.status)row.status='open';
  try{await api('todo_save',{id:tEditing?tEditing.id:null,todo:row})}catch(err){toast(err.message);return}
  closeTodo();toast('Saved');await load();
}
var tDelArmed=false;
async function deleteTodo(){
  var b=document.getElementById('tDel');
  if(!tDelArmed){tDelArmed=true;b.textContent='Tap again to delete';setTimeout(function(){tDelArmed=false;b.textContent='Delete'},3000);return}
  tDelArmed=false;b.textContent='Delete';
  try{await api('todo_delete',{id:tEditing.id})}catch(err){toast(err.message);return}
  closeTodo();toast('Deleted');await load();
}

// ── Actions ──
async function addNote(e,id){
  e.preventDefault();var inp=e.target.querySelector('input'),v=inp.value.trim();if(!v)return;
  try{await api('note',{id:id,note:v})}catch(err){toast(err.message);return}
  toast('Note added');await load();
}
function openProg(id){
  progId=id;var c=clients.find(function(x){return x.id===id});
  document.getElementById('pTitle').textContent=c.name+' · programmed to';
  document.getElementById('pDate').value=c.programmed_until||'';
  document.getElementById('pNote').value='';
  document.getElementById('pScrim').classList.add('open');
}
function closeProg(){document.getElementById('pScrim').classList.remove('open');progId=null}
function bump(days){
  var el=document.getElementById('pDate'),base=parseD(el.value),t=today();
  if(!base||base<t)base=t;base.setDate(base.getDate()+days);el.value=iso(base);
}
async function saveProg(){
  var v=document.getElementById('pDate').value||null,note=document.getElementById('pNote').value.trim();
  try{
    await api('save',{id:progId,client:{programmed_until:v}});
    await api('note',{id:progId,note:(note?note+' · ':'')+'Programmed to '+(v?fmtShort(v):'(cleared)')});
  }catch(err){toast(err.message);return}
  closeProg();toast('Updated');await load();
}
function openEditor(id){
  editing=id?clients.find(function(c){return c.id===id}):null;
  var f=document.getElementById('form');f.reset();
  var k=editing?kindOf(editing):tab;f.dataset.kind=k;document.getElementById('kindInp').value=k;
  document.getElementById('secLbl').textContent=k==='team'?'Team':'Client';
  f.querySelectorAll('[data-only] input,[data-only] select').forEach(function(el){el.disabled=el.closest('[data-only]').dataset.only!==k});
  document.getElementById('teamCodeSel').innerHTML='<option value="">None</option>'+teamCodes.map(function(t){return '<option value="'+esc(t.code)+'">'+esc(t.code)+(t.label?' · '+esc(t.label):'')+'</option>'}).join('');
  document.getElementById('appUserSel').innerHTML='<option value="">Not linked</option>'+appUsers.map(function(u){return '<option value="'+u.user_id+'">'+esc(u.email)+'</option>'}).join('');
  document.getElementById('formTitle').textContent=editing?'Edit '+editing.name:(k==='team'?'New team':'New client');
  document.getElementById('delBtn').style.visibility=editing?'visible':'hidden';
  if(editing)Array.prototype.forEach.call(f.elements,function(el){if(el.name&&!el.disabled&&el.name!=='kind'&&editing[el.name]!=null)el.value=editing[el.name]});
  document.getElementById('scrim').classList.add('open');
}
function closeEditor(){document.getElementById('scrim').classList.remove('open');editing=null}
async function saveClient(e){
  e.preventDefault();
  var row={};
  Array.prototype.forEach.call(e.target.elements,function(el){if(!el.name||el.disabled)return;var v=el.value.trim();
    row[el.name]=v===''?null:((el.name==='block_weeks'||el.name==='squad_size')?Number(v):v);});
  if(!row.offer)row.offer='coaching';if(!row.status)row.status='active';
  try{await api('save',{id:editing?editing.id:null,client:row})}catch(err){toast(err.message);return}
  closeEditor();toast('Saved');await load();
}
var delArmed=false;
async function deleteClient(){
  var b=document.getElementById('delBtn');
  if(!delArmed){delArmed=true;b.textContent='Tap again to delete';setTimeout(function(){delArmed=false;b.textContent='Delete'},3000);return}
  delArmed=false;b.textContent='Delete';
  try{await api('delete',{id:editing.id})}catch(err){toast(err.message);return}
  closeEditor();toast('Deleted');await load();
}

// ── Passphrase gate ──
function forget(){try{localStorage.removeItem(KEY_STORE)}catch(e){}rkey=null;document.getElementById('addBtn').style.display='none';document.getElementById('tabs').style.display='none';showGate('That passphrase didn\'t work. Try again.')}
function showGate(msg){
  main.innerHTML='<div class="gate"><h2>DBSP Hub</h2><p>'+(msg||'Enter your hub passphrase. This device will remember it.')+'</p>'
    +'<form onsubmit="unlock(event)" style="max-width:320px;margin:0 auto;display:flex;gap:8px"><input id="pp" type="password" autocomplete="current-password" placeholder="Passphrase" style="flex:1;font:15px DM Sans,sans-serif;padding:10px 12px;border:1.5px solid var(--bd2);border-radius:6px"><button class="btn p">Unlock</button></form></div>';
  setTimeout(function(){var el=document.getElementById('pp');if(el)el.focus()},50);
}
async function unlock(e){
  e.preventDefault();var v=document.getElementById('pp').value.trim();if(!v)return;
  rkey=v;main.innerHTML='<div class="empty">Checking…</div>';
  try{await api('ping')}catch(err){return}
  try{localStorage.setItem(KEY_STORE,v)}catch(e){}
  load();
}
function lock(){try{localStorage.removeItem(KEY_STORE)}catch(e){}rkey=null;document.getElementById('addBtn').style.display='none';document.getElementById('tabs').style.display='none';showGate()}
(function(){
  if(typeof SUPABASE_URL==='undefined'){main.innerHTML='<div class="empty">Couldn\'t connect to the database.</div>';return}
  try{rkey=localStorage.getItem(KEY_STORE)}catch(e){}
  if(rkey)load();else showGate();
})();
</script>
</body>
