<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>DBSP Client Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#eef2f7;--sf:#fff;--sf2:#f8fafc;--sf3:#f1f5f9;--bd:rgba(15,23,42,.07);--bd2:rgba(15,23,42,.13);--t:#0f172a;--t2:#334155;--t3:#64748b;--t4:#94a3b8;--green:#059669;--cyan:#0284c7;--amber:#b45309;--red:#dc2626;--purple:#7c3aed;--display:'Barlow Condensed',sans-serif}
body{background:var(--bg);color:var(--t);font:14px/1.45 'DM Sans',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:#fff;border-bottom:1px solid var(--bd);padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px}
h1{font:900 22px/1 var(--display);letter-spacing:1px;text-transform:uppercase}
h1 span{color:var(--green)}
.hsub{font-size:11px;color:var(--t3)}
header .sp{flex:1}
.btn{font:800 12px var(--display);letter-spacing:.6px;text-transform:uppercase;border-radius:20px;padding:8px 14px;border:1.5px solid var(--bd2);background:#fff;color:var(--t2);cursor:pointer;white-space:nowrap}
.btn.p{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:5px 10px;font-size:11px}
.btn.danger{color:var(--red);border-color:rgba(220,38,38,.35)}
main{max-width:980px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px 14px}
.stat .k{font:700 10px var(--display);letter-spacing:1.2px;text-transform:uppercase;color:var(--t3)}
.stat .v{font:800 26px/1.1 var(--display);margin-top:3px}
.stat .v.warn{color:var(--amber)}.stat .v.bad{color:var(--red)}.stat .v.good{color:var(--green)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{font:800 11px var(--display);letter-spacing:.6px;text-transform:uppercase;padding:6px 12px;border-radius:20px;border:1.5px solid var(--bd2);background:#fff;color:var(--t3);cursor:pointer}
.chip.on{background:var(--t);border-color:var(--t);color:#fff}
.bar .sp{flex:1}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.card.paused{opacity:.65}
.ctop{display:flex;gap:10px;align-items:flex-start}
.cname{font:800 19px/1.15 var(--display);letter-spacing:.3px}
.cmeta{font-size:12px;color:var(--t3);margin-top:2px}
.tag{display:inline-block;font:700 10px var(--display);letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--sf3);color:var(--t2);margin-right:4px}
.tag.coaching{background:rgba(5,150,105,.1);color:var(--green)}.tag.rehab{background:rgba(124,58,237,.1);color:var(--purple)}.tag.speed{background:rgba(2,132,199,.1);color:var(--cyan)}.tag.selfserve{background:rgba(180,83,9,.1);color:var(--amber)}
.ctop .sp{flex:1}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:12px}
.cell{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
.cell .k{font:700 10px var(--display);letter-spacing:1.1px;text-transform:uppercase;color:var(--t4);margin-bottom:3px}
.cell .v{font-size:13px;font-weight:600;color:var(--t2)}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.muted{color:var(--t4);font-weight:500}
.notes{font-size:12.5px;color:var(--t2);margin-top:10px;white-space:pre-wrap}
.empty,.gate{text-align:center;color:var(--t3);padding:48px 16px}
.gate h2{font:800 22px var(--display);color:var(--t);margin-bottom:8px;text-transform:uppercase}
.gate p{margin-bottom:16px}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
@media(min-width:640px){.scrim{align-items:center}}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet h3{font:800 20px var(--display);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.sec{font:700 10px var(--display);letter-spacing:1.4px;text-transform:uppercase;color:var(--t3);margin:14px 0 6px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px}
.f.full{grid-column:1/-1}
.f label{font-size:11px;font-weight:600;color:var(--t3)}
.f input,.f select,.f textarea{font:14px 'DM Sans',sans-serif;padding:8px 10px;border:1.5px solid var(--bd2);border-radius:8px;background:var(--sf2);color:var(--t);width:100%}
.f textarea{min-height:64px;resize:vertical}
.sheet-acts{display:flex;gap:8px;justify-content:space-between;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--t);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div><h1>DBSP <span>Roster</span></h1><div class="hsub">Coaching clients</div></div>
  <div class="sp"></div>
  <button class="btn p" id="addBtn" style="display:none" onclick="openEditor()">+ Client</button>
</header>
<main id="main"><div class="empty">Loading…</div></main>

<div class="scrim" id="scrim" onclick="if(event.target===this)closeEditor()">
  <form class="sheet" id="form" onsubmit="saveClient(event)">
    <h3 id="formTitle">New client</h3>
    <div class="sec">Client</div>
    <div class="fg">
      <div class="f"><label>Name</label><input name="name" required></div>
      <div class="f"><label>Team</label><input name="team" placeholder="e.g. Sunder"></div>
      <div class="f"><label>Offer</label><select name="offer"><option value="coaching">Custom coaching</option><option value="rehab">Injury rehab</option><option value="speed">Speed sessions</option><option value="selfserve">Self-serve</option></select></div>
      <div class="f"><label>Status</label><select name="status"><option value="active">Active</option><option value="paused">Paused</option><option value="ended">Ended</option></select></div>
      <div class="f"><label>Start date</label><input type="date" name="start_date"></div>
      <div class="f"><label>Frisbee Track account</label><select name="app_user_id" id="appUserSel"><option value="">Not linked</option></select></div>
    </div>
    <div class="sec">Payments</div>
    <div class="fg">
      <div class="f"><label>Monthly fee ($AUD)</label><input type="number" name="monthly_fee" min="0" step="1"></div>
      <div class="f"><label>Next payment</label><input type="date" name="next_payment"></div>
      <div class="f"><label>In-person sessions left</label><input type="number" name="sessions_left" min="0" step="1"></div>
    </div>
    <div class="sec">Check-ins</div>
    <div class="fg">
      <div class="f"><label>Weekly check-in day</label><select name="checkin_day"><option value="">None</option><option>Mon</option><option>Tue</option><option>Wed</option><option>Thu</option><option>Fri</option><option>Sat</option><option>Sun</option></select></div>
      <div class="f"><label>Last check-in</label><input type="date" name="last_checkin"></div>
    </div>
    <div class="sec">Season</div>
    <div class="fg">
      <div class="f"><label>Next tournament</label><input name="next_tournament" placeholder="e.g. Nationals"></div>
      <div class="f"><label>Tournament date</label><input type="date" name="tournament_date"></div>
      <div class="f"><label>Current phase</label><input name="phase" placeholder="e.g. Pre-season block 2"></div>
      <div class="f"><label>Block ends</label><input type="date" name="block_end"></div>
      <div class="f full"><label>Goals</label><textarea name="goals"></textarea></div>
      <div class="f full"><label>Notes</label><textarea name="notes"></textarea></div>
    </div>
    <div class="sheet-acts">
      <button type="button" class="btn danger" id="delBtn" onclick="deleteClient()">Delete</button>
      <div style="display:flex;gap:8px;margin-left:auto"><button type="button" class="btn" onclick="closeEditor()">Cancel</button><button class="btn p" type="submit">Save</button></div>
    </div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var COACH_UID='c0b4da2f-8ee8-4926-8b27-0d095cab8e17';
var OFFER_LABEL={coaching:'Custom coaching',rehab:'Injury rehab',speed:'Speed sessions',selfserve:'Self-serve'};
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var sb=null,clients=[],appUsers=[],loads={},filter='active',editing=null;
var main=document.getElementById('main');

function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function parseD(s){if(!s)return null;var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysUntil(s){var d=parseD(s);return d?Math.round((d-today())/86400000):null}
function fmtD(s){var d=parseD(s);return d?d.toLocaleDateString('en-AU',{day:'numeric',month:'short'}):'—'}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}

// ── Check-in status ──
function checkin(c){
  if(!c.checkin_day)return null;
  var idx=DAYS.indexOf(c.checkin_day);if(idx<0)return null;
  var t=today(),due=new Date(t);due.setDate(t.getDate()-((t.getDay()-idx+7)%7)); // most recent check-in day (today or earlier)
  var last=parseD(c.last_checkin);
  if(!last||last<due){
    var late=Math.round((t-due)/86400000);
    return late===0?{cls:'warn',txt:'Due today',due:true}:{cls:'bad',txt:'Overdue '+late+'d',due:true};
  }
  var next=new Date(due);next.setDate(due.getDate()+7);
  return{cls:'ok',txt:'Done · next '+next.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}),due:false};
}
function payment(c){
  var n=daysUntil(c.next_payment);if(n===null)return null;
  if(n<0)return{cls:'bad',txt:'Overdue '+(-n)+'d ('+fmtD(c.next_payment)+')',soon:true};
  if(n<=7)return{cls:'warn',txt:(n===0?'Today':'In '+n+'d')+' ('+fmtD(c.next_payment)+')',soon:true};
  return{cls:'',txt:fmtD(c.next_payment),soon:false};
}

// ── Load (same EWMA as the app's Sport Sci tab, on HSR) ──
function calcLoad(rows){
  var t=today(),start=new Date(t);start.setDate(t.getDate()-41);
  var daily=new Array(42).fill(0),wk={dist:0,hsr:0,vhsr:0,n:0},last=null;
  rows.forEach(function(r){
    var s=r.data||{};if(!s.date)return;
    var d=parseD(String(s.date).slice(0,10));if(!d)return;
    if(!last||d>last)last=d;
    var i=Math.round((d-start)/86400000);
    if(i>=0&&i<42)daily[i]+=(+s.hsr||0);
    if(i>=35&&i<42){wk.dist+=(+s.dist||0);wk.hsr+=(+s.hsr||0);wk.vhsr+=(+s.vhsr||0);wk.n++;}
  });
  var a=0,c=0,la=2/8,lc=2/29;
  daily.forEach(function(v){a=v*la+a*(1-la);c=v*lc+c*(1-lc)});
  return{wk:wk,ratio:c>0?a/c:null,last:last};
}
function zone(r){
  if(r===null||!isFinite(r))return{cls:'muted',l:'Not enough data'};
  if(r<0.8)return{cls:'warn',l:'Low load'};if(r<0.9)return{cls:'',l:'Taper/recovery'};
  if(r<=1.1)return{cls:'ok',l:'Sweet spot'};if(r<=1.3)return{cls:'',l:'Build'};
  if(r<=1.5)return{cls:'warn',l:'High load'};return{cls:'bad',l:'Spike'};
}

// ── Data ──
async function load(){
  var r=await sb.from('coach_clients').select('*').order('name');
  if(r.error){main.innerHTML='<div class="empty">Couldn\'t load clients: '+esc(r.error.message)+'</div>';return}
  clients=r.data||[];
  var u=await sb.from('coach_users_view').select('user_id,email').order('email');
  appUsers=u.data||[];
  var ids=clients.map(function(c){return c.app_user_id}).filter(Boolean);
  loads={};
  if(ids.length){
    var since=new Date();since.setDate(since.getDate()-60);
    var s=await sb.from('sessions').select('user_id,data').in('user_id',ids).gte('created_at',since.toISOString());
    var by={};(s.data||[]).forEach(function(x){(by[x.user_id]=by[x.user_id]||[]).push(x)});
    ids.forEach(function(id){loads[id]=calcLoad(by[id]||[])});
  }
  render();
}

function render(){
  var active=clients.filter(function(c){return c.status==='active'});
  var mrr=active.reduce(function(s,c){return s+(+c.monthly_fee||0)},0);
  var dueCI=active.filter(function(c){var x=checkin(c);return x&&x.due}).length;
  var payDue=active.filter(function(c){var x=payment(c);return x&&x.soon}).length;
  var blocks=active.filter(function(c){var n=daysUntil(c.block_end);return n!==null&&n>=0&&n<=14}).length;
  var list=clients.filter(function(c){return filter==='all'||c.status===filter});
  var h='<div class="stats">'
   +'<div class="stat"><div class="k">Active clients</div><div class="v">'+active.length+'</div></div>'
   +'<div class="stat"><div class="k">Monthly revenue</div><div class="v good">$'+mrr.toLocaleString('en-AU')+'</div></div>'
   +'<div class="stat"><div class="k">Check-ins due</div><div class="v '+(dueCI?'warn':'')+'">'+dueCI+'</div></div>'
   +'<div class="stat"><div class="k">Payments in 7 days</div><div class="v '+(payDue?'warn':'')+'">'+payDue+'</div></div>'
   +'<div class="stat"><div class="k">Blocks ending (14d)</div><div class="v">'+blocks+'</div></div>'
   +'</div><div class="bar">'
   +['active','paused','ended','all'].map(function(f){return '<button class="chip'+(filter===f?' on':'')+'" onclick="setFilter(\''+f+'\')">'+f+'</button>'}).join('')
   +'<div class="sp"></div></div>';
  if(!list.length)h+='<div class="empty">'+(clients.length?'No '+filter+' clients.':'No clients yet. Tap <b>+ Client</b> to add your first one.')+'</div>';
  list.forEach(function(c){
    var ci=checkin(c),pay=payment(c),L=c.app_user_id?loads[c.app_user_id]:null;
    var tDays=daysUntil(c.tournament_date),bDays=daysUntil(c.block_end);
    h+='<div class="card'+(c.status!=='active'?' paused':'')+'"><div class="ctop"><div>'
      +'<div class="cname">'+esc(c.name)+'</div>'
      +'<div class="cmeta"><span class="tag '+esc(c.offer)+'">'+esc(OFFER_LABEL[c.offer]||c.offer)+'</span>'
      +(c.team?esc(c.team)+' · ':'')+(c.status!=='active'?esc(c.status)+' · ':'')+(c.start_date?'since '+fmtD(c.start_date):'')+'</div></div>'
      +'<div class="sp"></div><div class="acts">'
      +(c.checkin_day&&c.status==='active'?'<button class="btn sm" onclick="markCheckin(\''+c.id+'\')">Check-in done</button>':'')
      +(c.next_payment&&c.status==='active'?'<button class="btn sm" onclick="markPaid(\''+c.id+'\')">Paid</button>':'')
      +'<button class="btn sm" onclick="openEditor(\''+c.id+'\')">Edit</button></div></div>'
      +'<div class="grid">'
      +'<div class="cell"><div class="k">Payment</div><div class="v">'+(c.monthly_fee?'$'+(+c.monthly_fee).toLocaleString('en-AU')+'/mo · ':'')
        +(pay?'<span class="'+pay.cls+'">'+pay.txt+'</span>':'<span class="muted">No date</span>')
        +(c.sessions_left!=null&&c.sessions_left!==''?'<br>'+c.sessions_left+' in-person session'+(c.sessions_left==1?'':'s')+' left':'')+'</div></div>'
      +'<div class="cell"><div class="k">Check-in'+(c.checkin_day?' ('+esc(c.checkin_day)+')':'')+'</div><div class="v">'
        +(ci?'<span class="'+ci.cls+'">'+ci.txt+'</span>':'<span class="muted">Not set</span>')+'</div></div>'
      +'<div class="cell"><div class="k">Season</div><div class="v">'
        +(c.next_tournament||c.tournament_date?esc(c.next_tournament||'Tournament')+(tDays!==null?' · '+(tDays>=0?tDays+'d out':'passed'):''):'<span class="muted">No tournament</span>')
        +(c.phase?'<br>'+esc(c.phase):'')+(c.block_end?'<br>Block ends '+fmtD(c.block_end)+(bDays!==null&&bDays>=0&&bDays<=14?' <span class="warn">('+bDays+'d)</span>':''):'')+'</div></div>'
      +'<div class="cell"><div class="k">Load (Frisbee Track)</div><div class="v">'+loadCell(c,L)+'</div></div>'
      +'</div>'
      +(c.goals?'<div class="notes"><b>Goals:</b> '+esc(c.goals)+'</div>':'')
      +(c.notes?'<div class="notes">'+esc(c.notes)+'</div>':'')
      +'</div>';
  });
  main.innerHTML=h;
}
function loadCell(c,L){
  if(!c.app_user_id)return '<span class="muted">Not linked</span>';
  if(!L||!L.last)return '<span class="muted">No sessions logged</span>';
  var z=zone(L.ratio),ago=Math.round((today()-L.last)/86400000);
  return 'Last 7d: '+L.wk.n+' session'+(L.wk.n===1?'':'s')+' · HSR '+Math.round(L.wk.hsr)+'m'
    +'<br>HSR ratio '+(L.ratio!==null?L.ratio.toFixed(2):'—')+' <span class="'+z.cls+'">'+z.l+'</span>'
    +'<br><span class="'+(ago>7?'warn':'muted')+'">Last logged '+(ago===0?'today':ago+'d ago')+'</span>';
}
function setFilter(f){filter=f;render()}

// ── Actions ──
async function update(id,patch,msg){
  var r=await sb.from('coach_clients').update(patch).eq('id',id);
  if(r.error){toast('Error: '+r.error.message);return}
  toast(msg);await load();
}
function markCheckin(id){update(id,{last_checkin:iso(today())},'Check-in logged')}
function markPaid(id){
  var c=clients.find(function(x){return x.id===id});var d=parseD(c.next_payment)||today();
  d.setMonth(d.getMonth()+1);update(id,{next_payment:iso(d)},'Next payment '+fmtD(iso(d)));
}
function openEditor(id){
  editing=id?clients.find(function(c){return c.id===id}):null;
  var f=document.getElementById('form');f.reset();
  var sel=document.getElementById('appUserSel');
  sel.innerHTML='<option value="">Not linked</option>'+appUsers.filter(function(u){return u.user_id!==COACH_UID}).map(function(u){return '<option value="'+u.user_id+'">'+esc(u.email)+'</option>'}).join('');
  document.getElementById('formTitle').textContent=editing?'Edit '+editing.name:'New client';
  document.getElementById('delBtn').style.visibility=editing?'visible':'hidden';
  if(editing)Array.prototype.forEach.call(f.elements,function(el){if(el.name&&editing[el.name]!=null)el.value=editing[el.name]});
  document.getElementById('scrim').classList.add('open');
}
function closeEditor(){document.getElementById('scrim').classList.remove('open');editing=null}
async function saveClient(e){
  e.preventDefault();
  var f=e.target,row={};
  Array.prototype.forEach.call(f.elements,function(el){if(!el.name)return;var v=el.value.trim();
    if(['monthly_fee','sessions_left'].indexOf(el.name)>-1)row[el.name]=v===''?null:Number(v);else row[el.name]=v===''?null:v;});
  if(!row.offer)row.offer='coaching';if(!row.status)row.status='active';
  var r=editing?await sb.from('coach_clients').update(row).eq('id',editing.id):await sb.from('coach_clients').insert(row);
  if(r.error){toast('Error: '+r.error.message);return}
  closeEditor();toast('Saved');await load();
}
var delArmed=false;
async function deleteClient(){
  var b=document.getElementById('delBtn');
  if(!delArmed){delArmed=true;b.textContent='Tap again to delete';setTimeout(function(){delArmed=false;b.textContent='Delete'},3000);return}
  delArmed=false;b.textContent='Delete';
  var r=await sb.from('coach_clients').delete().eq('id',editing.id);
  if(r.error){toast('Error: '+r.error.message);return}
  closeEditor();toast('Deleted');await load();
}

// ── Auth gate ──
function gate(msg,btn){main.innerHTML='<div class="gate"><h2>Coach only</h2><p>'+msg+'</p>'+(btn||'')+'</div>'}
async function signIn(){await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.href}})}
(async function(){
  if(typeof SUPABASE_URL==='undefined'||!window.supabase){gate('Couldn\'t connect to the database.');return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  var u=(await sb.auth.getUser()).data.user;
  if(!u){gate('Sign in with your coach account.','<button class="btn p" onclick="signIn()">Sign in with Google</button><p style="margin-top:14px;font-size:12px">Or sign in on <a href="./">Frisbee Track</a> first, then come back.</p>');return}
  if(u.id!==COACH_UID){gate('This page is only for the DBSP coach account.');return}
  document.getElementById('addBtn').style.display='';
  load();
})();
</script>
</body>
